<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Diagnóstico — Sinapse Comercial</title>
<style>
:root{
  --preto:#0E0D0D; --preto2:#171515; --carvao:#231F20; --cinza:#414042;
  --cinza-claro:#DCDDDE; --vermelho:#FF0000; --vermelho-claro:#FF6B5E;
  --vermelho-fundo:#7A1315; --branco:#FFFFFF; --verde:#4ADE80;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--preto); color:var(--branco);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:24px; line-height:1.55; min-height:100vh;
}
.wrap{max-width:860px;margin:0 auto;}
h1{font-size:22px;margin-bottom:6px;}
h1 span{color:var(--vermelho);}
.sub{color:var(--cinza-claro);font-size:14px;margin-bottom:22px;}
.campo{margin-bottom:14px;}
label{display:block;font-size:13px;color:var(--cinza-claro);margin-bottom:6px;}
input{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--cinza);
  background:var(--preto2);color:var(--branco);font-size:14px;font-family:monospace;
}
input:focus{outline:none;border-color:var(--vermelho);}
button{
  border:none;border-radius:999px;padding:14px 30px;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--vermelho),#D03025);color:#fff;cursor:pointer;
  margin-top:8px;
}
button:disabled{opacity:.5;cursor:not-allowed;}
.passo{
  border:1px solid var(--carvao);border-radius:12px;padding:14px 16px;margin-top:12px;
  background:var(--preto2);
}
.passo-topo{display:flex;align-items:center;gap:10px;}
.icone{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.pendente{background:var(--carvao);color:var(--cinza-claro);}
.ok{background:var(--verde);color:#000;}
.falha{background:var(--vermelho);color:#fff;}
.passo-nome{font-weight:600;font-size:14.5px;}
.detalhe{
  margin-top:10px;font-family:monospace;font-size:12.5px;color:var(--cinza-claro);
  background:var(--preto);border-radius:8px;padding:10px 12px;white-space:pre-wrap;
  word-break:break-all;border-left:3px solid var(--carvao);
}
.detalhe.erro{border-left-color:var(--vermelho);color:var(--vermelho-claro);}
.detalhe.bom{border-left-color:var(--verde);}
.diagnostico{
  margin-top:22px;padding:18px;border-radius:12px;border:1px solid var(--vermelho);
  background:rgba(122,19,21,.25);
}
.diagnostico h2{font-size:16px;margin-bottom:10px;color:var(--vermelho-claro);}
.diagnostico p{font-size:14px;margin-bottom:8px;}
.diagnostico code{background:var(--preto);padding:2px 6px;border-radius:4px;font-size:13px;}
.oculto{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Diagnóstico <span>Sinapse Comercial</span></h1>
  <p class="sub">Testa cada etapa da gravação no Supabase e mostra exatamente onde falha.</p>

  <div class="campo">
    <label for="url">URL do Supabase</label>
    <input id="url" value="https://erdjglcztzcxewpfecls.supabase.co"/>
  </div>
  <div class="campo">
    <label for="chave">Chave anon (a longa, começa com eyJ)</label>
    <input id="chave" placeholder="eyJhbGciOi..."/>
  </div>
  <button id="btn">Rodar diagnóstico</button>

  <div id="passos"></div>
  <div id="diag" class="diagnostico oculto"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const PASSOS = [
  ["conexao",       "1. Conexão com o Supabase"],
  ["chaveValida",   "2. Chave aceita pelo servidor"],
  ["lerRanking",    "3. Ler a view pública do ranking"],
  ["inserirPart",   "4. Inserir em participantes"],
  ["inserirPartic", "5. Inserir em participacoes"],
  ["inserirResp",   "6. Inserir em respostas"],
  ["buscarToken",   "7. Buscar resultado pelo token (o que o QR Code faz)"],
  ["limpar",        "8. Remover os dados de teste"],
];

function montarPassos() {
  $("#passos").innerHTML = PASSOS.map(([id, nome]) => `
    <div class="passo" id="p-${id}">
      <div class="passo-topo">
        <span class="icone pendente" id="i-${id}">•</span>
        <span class="passo-nome">${nome}</span>
      </div>
      <div class="detalhe oculto" id="d-${id}"></div>
    </div>`).join("");
}

function marcar(id, estado, detalhe) {
  const ic = $("#i-" + id);
  ic.className = "icone " + estado;
  ic.textContent = estado === "ok" ? "✓" : estado === "falha" ? "✕" : "•";
  if (detalhe) {
    const d = $("#d-" + id);
    d.className = "detalhe " + (estado === "falha" ? "erro" : "bom");
    d.textContent = detalhe;
  }
}

// identificadores fixos, para o passo 8 conseguir limpar tudo depois
const IDS = {
  participante: "d1a9f000-0000-4000-8000-000000000001",
  participacao: "d1a9f000-0000-4000-8000-000000000002",
  token:        "d1a9f000-0000-4000-8000-000000000003",
  resposta:     "d1a9f000-0000-4000-8000-000000000004",
  cpf:          "00000000191",
};

async function req(url, chave, caminho, opcoes) {
  opcoes = opcoes || {};
  const resp = await fetch(url.replace(/\/+$/, "") + caminho, {
    method: opcoes.method || "GET",
    headers: {
      apikey: chave,
      Authorization: "Bearer " + chave,
      "Content-Type": "application/json",
      ...(opcoes.headers || {}),
    },
    body: opcoes.body ? JSON.stringify(opcoes.body) : undefined,
  });
  const texto = await resp.text();
  return { status: resp.status, ok: resp.ok, texto };
}

const falhas = [];

async function rodar() {
  const url = $("#url").value.trim();
  const chave = $("#chave").value.trim();
  falhas.length = 0;
  montarPassos();
  $("#diag").className = "diagnostico oculto";
  $("#btn").disabled = true;

  if (!chave.startsWith("eyJ")) {
    marcar("conexao", "falha", "A chave informada não parece ser um JWT do Supabase.\nEla precisa começar com 'eyJ'.\nValor recebido começa com: " + chave.slice(0, 10));
    falhas.push("chave_formato");
    concluir();
    return;
  }

  // 1 e 2: conexão + chave
  try {
    const r = await req(url, chave, "/rest/v1/");
    if (r.status === 401 || r.status === 403) {
      marcar("conexao", "ok", "Servidor respondeu (status " + r.status + ")");
      marcar("chaveValida", "falha", "Servidor recusou a chave.\nstatus " + r.status + "\n" + r.texto.slice(0, 400));
      falhas.push("chave_recusada");
      concluir(); return;
    }
    marcar("conexao", "ok", "Servidor respondeu: status " + r.status);
    marcar("chaveValida", "ok", "Chave aceita.");
  } catch (e) {
    marcar("conexao", "falha", "Não foi possível alcançar o servidor.\n" + e.message +
      "\n\nCausas comuns: sem internet, URL errada, ou a página está sendo aberta como arquivo local (file://) e o navegador bloqueou.");
    falhas.push("sem_conexao");
    concluir(); return;
  }

  // 3: leitura do ranking
  try {
    const r = await req(url, chave, "/rest/v1/ranking_publico?select=id&limit=1");
    if (r.ok) marcar("lerRanking", "ok", "Leitura OK. Resposta: " + (r.texto || "[]"));
    else { marcar("lerRanking", "falha", "status " + r.status + "\n" + r.texto.slice(0, 400)); falhas.push("ler_ranking"); }
  } catch (e) { marcar("lerRanking", "falha", e.message); falhas.push("ler_ranking"); }

  // 4: inserir participante
  try {
    const r = await req(url, chave, "/rest/v1/participantes?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: [{ id: IDS.participante, cpf: IDS.cpf, nome: "DIAGNOSTICO TESTE",
               loja: "TESTE", estado: "PR", lgpd_aceito: true, lgpd_timestamp: new Date().toISOString() }],
    });
    if (r.ok) marcar("inserirPart", "ok", "Inserção OK (status " + r.status + ")");
    else { marcar("inserirPart", "falha", "status " + r.status + "\n" + r.texto.slice(0, 500)); falhas.push("inserir_participante"); }
  } catch (e) { marcar("inserirPart", "falha", e.message); falhas.push("inserir_participante"); }

  // 5: inserir participacao
  try {
    const agora = new Date().toISOString();
    const r = await req(url, chave, "/rest/v1/participacoes?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: [{ id: IDS.participacao, token: IDS.token, participante_id: IDS.participante,
               cpf: IDS.cpf, nome: "DIAGNOSTICO TESTE", loja: "TESTE", estado: "PR",
               data: agora.slice(0, 10), hora_inicio: agora, hora_fim: agora,
               total_acertos: 3, tempo_total_segundos: 20, pontuacao: 100,
               elegivel_sorteio: true, tipo_brinde: "especial", brinde_entregue: false,
               modo_teste: false }],
    });
    if (r.ok) marcar("inserirPartic", "ok", "Inserção OK (status " + r.status + ")");
    else { marcar("inserirPartic", "falha", "status " + r.status + "\n" + r.texto.slice(0, 500)); falhas.push("inserir_participacao"); }
  } catch (e) { marcar("inserirPartic", "falha", e.message); falhas.push("inserir_participacao"); }

  // 6: inserir resposta
  try {
    const r = await req(url, chave, "/rest/v1/respostas?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: [{ id: IDS.resposta, participacao_id: IDS.participacao, pergunta_id: "DIAG",
               eixo: "Produto", ordem: 1, alternativa_escolhida: "C", resposta_correta: "C",
               status: "certo", tempo_segundos: 5, nivel_dificuldade: "Fácil" }],
    });
    if (r.ok) marcar("inserirResp", "ok", "Inserção OK (status " + r.status + ")");
    else { marcar("inserirResp", "falha", "status " + r.status + "\n" + r.texto.slice(0, 500)); falhas.push("inserir_resposta"); }
  } catch (e) { marcar("inserirResp", "falha", e.message); falhas.push("inserir_resposta"); }

  // 7: buscar pelo token (o que o QR Code faz)
  try {
    const r = await req(url, chave, "/rest/v1/rpc/buscar_resultado_individual", {
      method: "POST", body: { token_input: IDS.token },
    });
    if (r.ok) {
      const vazio = !r.texto || r.texto.trim() === "[]";
      if (vazio) { marcar("buscarToken", "falha", "A função respondeu, mas não retornou nada.\nIsso é o que faz o QR Code mostrar 'Ainda processando'."); falhas.push("token_vazio"); }
      else marcar("buscarToken", "ok", "Resultado encontrado:\n" + r.texto.slice(0, 400));
    } else { marcar("buscarToken", "falha", "status " + r.status + "\n" + r.texto.slice(0, 500)); falhas.push("buscar_token"); }
  } catch (e) { marcar("buscarToken", "falha", e.message); falhas.push("buscar_token"); }

  // 8: limpeza (pode falhar sem problema, anon não tem delete)
  try {
    const r = await req(url, chave, "/rest/v1/participacoes?id=eq." + IDS.participacao, { method: "DELETE" });
    if (r.ok) marcar("limpar", "ok", "Dados de teste removidos.");
    else marcar("limpar", "pendente", "Não foi possível remover automaticamente (esperado: a chave anon não tem permissão de exclusão).\nRemova pelo Table Editor procurando por 'DIAGNOSTICO TESTE'.");
  } catch (e) { marcar("limpar", "pendente", "Remova manualmente pelo Table Editor: procure 'DIAGNOSTICO TESTE'."); }

  concluir();
}

function concluir() {
  $("#btn").disabled = false;
  const d = $("#diag");
  d.className = "diagnostico";
  let h = "<h2>Diagnóstico</h2>";

  if (falhas.length === 0) {
    h += "<p><b>Tudo funcionou.</b> A gravação e a busca por token estão OK.</p>" +
         "<p>Se o quiz ainda não grava, o problema está no arquivo do quiz, não no banco. " +
         "O suspeito é a flag <code>TEST_MODE_PERMITIR_CPF_REPETIDO: true</code>, que marca as " +
         "participações como teste — e a busca por token ignora dados de teste.</p>";
  } else if (falhas.includes("chave_formato")) {
    h += "<p>A chave informada não é válida. Copie novamente do Supabase: " +
         "<b>Project Settings → API Keys → aba 'Legacy anon, service_role API keys'</b>, chave <code>anon</code>.</p>";
  } else if (falhas.includes("sem_conexao")) {
    h += "<p>Não foi possível alcançar o Supabase. Verifique a internet e se a URL está correta.</p>" +
         "<p>Se esta página foi aberta como arquivo do computador (endereço começando com <code>file:///</code>), " +
         "o navegador bloqueia a comunicação. Publique no GitHub Pages e abra por <code>https://</code>.</p>";
  } else if (falhas.includes("chave_recusada")) {
    h += "<p>O servidor recusou a chave. Ela pode estar incompleta (faltando caracteres no fim) " +
         "ou ser de outro projeto. Copie de novo, inteira.</p>";
  } else if (falhas.includes("inserir_participante") || falhas.includes("inserir_participacao") || falhas.includes("inserir_resposta")) {
    h += "<p><b>O banco está recusando a gravação.</b> Veja o status e a mensagem no passo que falhou:</p>" +
         "<p><code>401/403</code> → falta permissão. Rode no SQL Editor:<br>" +
         "<code>grant insert on participantes, participacoes, respostas to anon;</code></p>" +
         "<p><code>400/404</code> → alguma coluna não existe. Provavelmente o SQL de setup não " +
         "rodou por completo (as colunas <code>loja</code>, <code>estado</code>, <code>token</code> e " +
         "<code>pontuacao</code> vêm na segunda parte do arquivo).</p>";
  } else if (falhas.includes("token_vazio")) {
    h += "<p>A gravação funciona, mas a busca por token não retorna nada. " +
         "A função filtra <code>modo_teste = false</code>, então participações marcadas como teste não aparecem.</p>" +
         "<p>No arquivo do quiz, mude <code>TEST_MODE_PERMITIR_CPF_REPETIDO</code> e <code>MODO_TESTE</code> para <code>false</code>.</p>";
  } else if (falhas.includes("buscar_token")) {
    h += "<p>A função <code>buscar_resultado_individual</code> não respondeu corretamente. " +
         "Ela pode não ter sido criada — rode a segunda parte do <code>setup_supabase_completo.sql</code> novamente.</p>";
  } else if (falhas.includes("ler_ranking")) {
    h += "<p>A view <code>ranking_publico</code> não pôde ser lida. Rode o SQL de setup novamente.</p>";
  }

  h += "<p style='margin-top:14px;color:#DCDDDE;font-size:13px'>Tire um print desta tela inteira e envie no chat.</p>";
  d.innerHTML = h;
}

montarPassos();
$("#btn").addEventListener("click", rodar);
</script>
</body>
</html>
