<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ranking — Sinapse Comercial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --preto:#0E0D0D; --preto-2:#171515; --carvao:#231F20; --cinza:#414042;
  --cinza-claro:#DCDDDE; --vermelho:#FF0000; --vermelho-2:#D03025; --vermelho-fundo:#7A1315;
  --branco:#FFFFFF;
  --fonte:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 1200px 800px at 15% -10%, rgba(255,0,0,.12), transparent 60%),
    radial-gradient(ellipse 1200px 900px at 110% 110%, rgba(122,19,21,.25), transparent 55%),
    var(--preto);
  color:var(--branco);
  font-family:var(--fonte);
  min-height:100vh;
  padding:3.5vh 4vw;
  display:flex;
  flex-direction:column;
}
.topo{display:flex; align-items:center; justify-content:space-between; margin-bottom:2.5vh;}
.marca{display:flex; align-items:center; gap:18px;}
.marca svg{width:52px; height:52px;}
.marca h1{font-size:clamp(24px,2.6vw,38px); font-weight:800; letter-spacing:-.01em;}
.marca h1 span{color:var(--vermelho);}
.status{
  font-size:13px; color:var(--cinza-claro); display:flex; align-items:center; gap:8px;
  border:1px solid var(--carvao); padding:8px 16px; border-radius:999px; background:rgba(255,255,255,.03);
}
.status .ponto{width:9px; height:9px; border-radius:50%; background:#4ADE80; box-shadow:0 0 8px #4ADE80;}
.status.offline .ponto{background:var(--vermelho); box-shadow:0 0 8px var(--vermelho); animation:piscar 1s infinite;}
@keyframes piscar{50%{opacity:.3;}}

.lista{flex:1; display:flex; flex-direction:column; gap:1.1vh; overflow:hidden;}
.linha{
  display:flex; align-items:center; gap:2vw;
  background:var(--preto-2); border:1px solid var(--carvao); border-radius:18px;
  padding:1.6vh 2vw;
  animation:entra .45s ease both;
}
.linha.novo{animation:entraDestaque .9s ease both;}
@keyframes entra{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes entraDestaque{
  0%{opacity:0; transform:translateX(-24px); box-shadow:0 0 0 rgba(255,0,0,0);}
  40%{opacity:1; transform:translateX(0); box-shadow:0 0 40px rgba(255,0,0,.5);}
  100%{box-shadow:0 0 0 rgba(255,0,0,0);}
}
.linha.pos-1{border-color:rgba(255,0,0,.5); background:linear-gradient(90deg, rgba(255,0,0,.10), var(--preto-2) 40%);}
.pos{
  font-size:clamp(28px,3.2vw,44px); font-weight:800; color:var(--vermelho); width:4.5vw; text-align:center; flex-shrink:0;
}
.linha.pos-1 .pos{color:var(--branco); text-shadow:0 0 20px rgba(255,0,0,.8);}
.nome{flex:1; font-size:clamp(20px,2.4vw,32px); font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.metricas{display:flex; gap:3vw; flex-shrink:0;}
.metrica{text-align:right;}
.metrica .valor{font-size:clamp(18px,2.1vw,28px); font-weight:800;}
.metrica .rotulo{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--cinza-claro);}


/* --- identificação: nome + loja empilhados --- */
.identificacao{flex:1; min-width:0;}
.nome{font-size:clamp(20px,2.4vw,32px); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.loja{
  font-size:clamp(11px,1.1vw,15px);
  color:var(--cinza-claro);
  opacity:.75;
  margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.metrica .valor.destaque{color:var(--branco); font-size:clamp(20px,2.4vw,32px);}

/* --- pódio: hierarquia construída só com a paleta --- */
.icone-podio{display:inline-flex; width:clamp(28px,3vw,46px); height:clamp(28px,3vw,46px);}
.icone-podio svg{width:100%; height:100%;}
.ouro{color:var(--vermelho); filter:drop-shadow(0 0 10px rgba(255,0,0,.85));}
.prata{color:var(--branco); filter:drop-shadow(0 0 6px rgba(255,255,255,.45));}
.bronze{color:var(--cinza-claro); opacity:.8;}
.linha.podio{border-color:rgba(255,0,0,.35);}
.linha.pos-2{background:linear-gradient(90deg, rgba(255,255,255,.05), var(--preto-2) 45%);}
.linha.pos-3{background:linear-gradient(90deg, rgba(220,221,222,.035), var(--preto-2) 45%);}
.linha.pos-1 .metrica .valor.destaque{color:var(--vermelho); text-shadow:0 0 16px rgba(255,0,0,.5);}
.vazio{flex:1; display:flex; align-items:center; justify-content:center; color:var(--cinza); font-size:20px;}
.rodape{margin-top:2vh; text-align:center; color:var(--cinza); font-size:12px; letter-spacing:.04em;}
</style>
</head>
<body>
  <div class="topo">
    <div class="marca">
      <svg viewBox="0 0 200 200"><defs><radialGradient id="hubGradTV" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#FF6A5C"/><stop offset="45%" stop-color="#FF0000"/><stop offset="100%" stop-color="#7A1315"/></radialGradient></defs><g stroke="#FF0000" stroke-width="3.2" stroke-linecap="round" opacity="0.9"><line x1="100" y1="100" x2="100" y2="34"/><line x1="100" y1="100" x2="157" y2="133"/><line x1="100" y1="100" x2="43" y2="133"/></g><circle cx="100" cy="34" r="13" fill="#DCDDDE"/><circle cx="157" cy="133" r="13" fill="#DCDDDE"/><circle cx="43" cy="133" r="13" fill="#DCDDDE"/><circle cx="100" cy="100" r="26" fill="url(#hubGradTV)"/><path d="M100 87 L92 103 L99 103 L96 116 L110 97 L102 97 Z" fill="#FFFFFF"/></svg>
      <h1>RANKING <span>SINAPSE COMERCIAL</span></h1>
    </div>
    <div class="status" id="statusConexao"><span class="ponto"></span><span id="statusTexto">conectando...</span></div>
  </div>

  <div class="lista" id="lista">
    <div class="vazio">Aguardando as primeiras participações...</div>
  </div>

  <div class="rodape">Atualiza automaticamente — não precisa recarregar a página</div>

<script>
// =====================================================================
// CONFIGURAÇÃO — mesmo URL/chave do app principal
// =====================================================================
const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const SUPABASE_ANON_KEY = "SUA-CHAVE-ANON-AQUI";
const TOP_N = 10;
const INTERVALO_POLL_MS = 8000; // rede de segurança além do tempo real

function formatarTempo(segundosTotais) {
  const s = Math.round(segundosTotais);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}


// ícones do pódio — SVG próprio, os mesmos usados no quiz. Emoji não é
// usado de propósito: muda de desenho conforme o sistema operacional.
const ICONE_TROFEU = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 2.5"/><path d="M17 6h2.5A2.5 2.5 0 0 1 17 8.5"/><path d="M12 14v3"/><path d="M8.5 20h7"/><path d="M10 17h4l.6 3h-5.2z"/></svg>`;
const ICONE_MEDALHA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="5"/><path d="M8.5 10.5 6 3h4l2 4"/><path d="M15.5 10.5 18 3h-4l-1 2"/></svg>`;
const MEDALHAS = [
  `<span class="icone-podio ouro">${ICONE_TROFEU}</span>`,
  `<span class="icone-podio prata">${ICONE_MEDALHA}</span>`,
  `<span class="icone-podio bronze">${ICONE_MEDALHA}</span>`,
];

let ultimoRankingIds = new Set();
let clienteSupabase = null;
let ultimaAtualizacaoOk = false;

function definirStatus(conectado, texto) {
  const el = document.getElementById("statusConexao");
  el.classList.toggle("offline", !conectado);
  document.getElementById("statusTexto").textContent = texto;
}

async function buscarRanking() {
  const resp = await fetch(
    `${SUPABASE_URL}/rest/v1/ranking_publico?select=id,nome,loja,estado,total_acertos,tempo_total_segundos,pontuacao&order=total_acertos.desc,tempo_total_segundos.asc&limit=${TOP_N}`,
    {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    }
  );
  if (!resp.ok) throw new Error("falha ao buscar ranking: " + resp.status);
  return resp.json();
}

function renderizarRanking(linhas) {
  const container = document.getElementById("lista");
  if (!linhas || linhas.length === 0) {
    container.innerHTML = '<div class="vazio">Aguardando as primeiras participações...</div>';
    return;
  }
  const novosIds = new Set(linhas.map((l) => l.id));
  const apareceramAgora = [...novosIds].filter((id) => !ultimoRankingIds.has(id));

  container.innerHTML = linhas
    .map((l, i) => {
      const ehNovo = apareceramAgora.includes(l.id);
      const local = [l.loja, l.estado].filter(Boolean).join(" · ");
      const pontos = l.pontuacao != null ? l.pontuacao : l.total_acertos * 20;
      return `
      <div class="linha ${i < 3 ? "podio pos-" + (i + 1) : ""} ${ehNovo ? "novo" : ""}">
        <div class="pos">${i < 3 ? MEDALHAS[i] : `${i + 1}º`}</div>
        <div class="identificacao">
          <div class="nome">${l.nome}</div>
          ${local ? `<div class="loja">${local}</div>` : ""}
        </div>
        <div class="metricas">
          <div class="metrica"><div class="valor destaque">${pontos}</div><div class="rotulo">Pontos</div></div>
          <div class="metrica"><div class="valor">${l.total_acertos}/3</div><div class="rotulo">Acertos</div></div>
          <div class="metrica"><div class="valor">${formatarTempo(l.tempo_total_segundos)}</div><div class="rotulo">Tempo</div></div>
        </div>
      </div>`;
    })
    .join("");

  ultimoRankingIds = novosIds;
}

async function atualizar() {
  try {
    const linhas = await buscarRanking();
    renderizarRanking(linhas);
    ultimaAtualizacaoOk = true;
    definirStatus(true, "ao vivo");
  } catch (e) {
    definirStatus(false, "reconectando...");
  }
}

function iniciar() {
  if (SUPABASE_URL.indexOf("SEU-PROJETO") !== -1) {
    definirStatus(false, "configure SUPABASE_URL / SUPABASE_ANON_KEY no topo do arquivo");
    return;
  }

  // tempo real: reage assim que uma nova participação é gravada
  try {
    clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    clienteSupabase
      .channel("participacoes-realtime")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "participacoes" }, () => {
        atualizar();
      })
      .subscribe((status) => {
        if (status === "SUBSCRIBED") definirStatus(true, "ao vivo");
      });
  } catch (e) {
    console.warn("Realtime indisponível, seguindo só com atualização periódica.", e);
  }

  // rede de segurança: mesmo se o tempo real falhar, atualiza sozinho
  atualizar();
  setInterval(atualizar, INTERVALO_POLL_MS);
  window.addEventListener("online", atualizar);
  window.addEventListener("offline", () => definirStatus(false, "sem conexão"));
}

iniciar();
</script>
</body>
</html>
