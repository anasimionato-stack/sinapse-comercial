*{box-sizing:border-box; margin:0; padding:0;}
html,body{min-height:100%;}
body{
  background:
    radial-gradient(ellipse 700px 500px at 20% -5%, rgba(255,0,0,.12), transparent 60%),
    radial-gradient(ellipse 700px 600px at 100% 100%, rgba(122,19,21,.24), transparent 55%),
    var(--preto);
  color:var(--branco);
  font-family:var(--fonte-arcade);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--branco); outline-offset:3px; border-radius:6px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}

.wrap{max-width:480px; margin:0 auto; padding:28px 20px 60px; min-height:100vh; display:flex; flex-direction:column;}

/* ---------- estados de carregamento / erro ---------- */
.estado-central{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:40px 12px;}
.estado-central p{color:var(--cinza-claro); font-size:14px; max-width:280px; line-height:1.5;}
.spinner-sinapse{width:64px; height:64px; position:relative;}
.spinner-sinapse svg{width:100%; height:100%; animation:girar 1.6s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}
.texto-revelacao{font-size:15px; font-weight:600; letter-spacing:.02em; min-height:20px;}
.btn{
  border:none; border-radius:999px; padding:13px 26px; font-size:14.5px; font-weight:700;
  letter-spacing:.01em; transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primario{background:linear-gradient(135deg, var(--vermelho), var(--vermelho-2)); color:var(--branco); box-shadow:0 0 24px rgba(255,0,0,.25);}
.btn-secundario{background:transparent; color:var(--branco); border:1px solid var(--carvao);}

/* ---------- sequência de revelação ---------- */
#telaRevelacao{animation:fadeIn .3s ease both;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

/* ---------- conteúdo principal ---------- */
.secao{width:100%; margin-top:34px; animation:entraSecao .5s ease both;}
@keyframes entraSecao{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--vermelho); font-weight:700; margin-bottom:10px;}

.perfil-nome{font-size:30px; font-weight:800; letter-spacing:-.01em; line-height:1.1;}
.perfil-desc{margin-top:10px; font-size:14.5px; line-height:1.55; color:var(--cinza-claro);}

.metricas-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:22px;}
.metrica-card{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
  border:1px solid var(--carvao); border-radius:16px; padding:16px 14px;
  backdrop-filter:blur(6px);
}
.metrica-valor{font-size:24px; font-weight:800;}
.metrica-rotulo{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--cinza-claro); margin-top:4px;}

.forcas-lista{display:flex; flex-direction:column; gap:12px; margin-top:16px;}
.forca-item{display:flex; align-items:center; gap:12px;}
.forca-ponto{width:10px; height:10px; border-radius:50%; background:var(--vermelho); box-shadow:0 0 8px rgba(255,0,0,.6); flex-shrink:0;}
.forca-nome{flex:1; font-size:14px; font-weight:600;}
.forca-barra-wrap{width:70px; height:6px; background:var(--carvao); border-radius:999px; overflow:hidden; flex-shrink:0;}
.forca-barra{height:100%; background:linear-gradient(90deg, var(--vermelho-2), var(--vermelho)); border-radius:999px; animation:cresceBarra 1s ease both;}
@keyframes cresceBarra{from{width:0;}}

.deck-cards{display:flex; flex-direction:column; gap:12px; margin-top:16px;}
.card-conexao{
  border:1px solid var(--carvao); border-radius:16px; padding:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
  cursor:pointer; transition:border-color .2s ease;
}
.card-conexao:hover{border-color:var(--vermelho-fundo);}
.card-conexao-topo{display:flex; align-items:center; gap:10px;}
.card-conexao-icone{width:18px; height:18px; flex-shrink:0; color:var(--vermelho);}
.card-conexao-titulo{font-size:14px; font-weight:700;}
.card-conexao-sub{font-size:12px; color:var(--cinza-claro); margin-top:4px;}
.card-conexao-corpo{
  max-height:0; overflow:hidden; transition:max-height .35s ease;
}
.card-conexao.aberto .card-conexao-corpo{max-height:400px; margin-top:14px;}
.card-conexao-linha{font-size:13px; line-height:1.5; margin-bottom:8px;}
.card-conexao-linha b{color:var(--branco);}
.card-conexao-cta{
  display:inline-block; margin-top:6px; font-size:13px; font-weight:700; color:var(--vermelho);
  text-decoration:none;
}

.card-resumo{
  margin-top:28px; border:1px solid var(--carvao); border-radius:20px; padding:22px;
  background:linear-gradient(160deg, rgba(255,0,0,.06), rgba(255,255,255,.02));
  text-align:center;
}
.card-resumo-titulo{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--cinza-claro); font-weight:700;}
.card-resumo-perfil{font-size:22px; font-weight:800; margin-top:6px;}
.card-resumo-linha{display:flex; justify-content:center; gap:18px; margin-top:14px; font-size:13px; color:var(--cinza-claro);}
.card-resumo-linha b{color:var(--branco); font-size:15px; display:block;}

.acoes-finais{display:flex; flex-direction:column; gap:10px; margin-top:22px;}

.rodape-marca{margin-top:40px; text-align:center; font-size:11px; color:var(--cinza); letter-spacing:.05em;}

/* ---------- tipografia arcade (mesma do quiz) ----------
   A página é a continuação da experiência: precisa da mesma tipografia.
   Como a fonte é larga e tem altura-de-x baixa, cada bloco recebe
   tamanho menor e entrelinha bem maior que o padrão. */
.perfil-nome{font-size:19px; line-height:1.5; letter-spacing:-.03em;}
.perfil-desc{font-size:10.5px; line-height:2; letter-spacing:-.02em;}
.eyebrow{font-size:9px; letter-spacing:.06em;}
.metrica-valor{font-size:17px; letter-spacing:-.04em;}
.metrica-rotulo{font-size:8px; letter-spacing:.04em;}
.forca-nome{font-size:10px; letter-spacing:-.02em;}
.card-conexao-titulo{font-size:10px; line-height:1.7; letter-spacing:-.02em;}
.card-conexao-sub{font-size:8.5px; line-height:1.7;}
.card-conexao-linha{font-size:9.5px; line-height:1.9;}
.card-conexao-cta{font-size:9.5px;}
.card-resumo-titulo{font-size:9px; letter-spacing:.08em;}
.card-resumo-perfil{font-size:15px; line-height:1.5; letter-spacing:-.03em;}
.card-resumo-linha{font-size:9px; line-height:1.8;}
.card-resumo-linha b{font-size:12px;}
.btn{font-size:11px; line-height:1.6; letter-spacing:-.02em;}
.texto-revelacao{font-size:10.5px; line-height:1.9; letter-spacing:-.02em;}
.estado-central p{font-size:9.5px; line-height:1.95;}
.rodape-marca{font-size:8px; letter-spacing:.06em;}
@media (min-width:900px){
  .perfil-nome{font-size:24px;}
  .perfil-desc{font-size:12px;}
  .btn{font-size:13px;}
  .metrica-valor{font-size:20px;}
}
</style>

    descricao: "Sabe argumentar e conhece as regras do jogo. Aprofundar o produto destrava o próximo nível.",
  },
  "Produto|Objeção": {
    nome: "Comunicador",
    descricao: "Conecta produto e argumentação com naturalidade. As regras de negócio são a próxima conexão a fortalecer.",
  },
  "Produto": {
    nome: "Conhecedor de Produto",
    descricao: "Base sólida em produto. Objeção e regras de negócio ainda pedem reforço para completar o mapa.",
  },
  "Objeção": {
    nome: "Persuasivo",
    descricao: "Argumenta bem diante de objeções. Produto e regras de negócio são as próximas conexões a desbloquear.",
  },
  "Regra de Negócio": {
    nome: "Técnico de Regras",
    descricao: "Conhece profundamente as regras do negócio. Produto e objeção ainda têm espaço para crescer.",
  },
};

function obterPerfil(eixosCertos) {
  const chave = chavePerfil(eixosCertos);
  return TAXONOMIA_PERFIS[chave] || TAXONOMIA_PERFIS[""];
}

const ICONE_CADEADO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

function formatarTempo(segundosTotais) {
  const s = Math.round(segundosTotais);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}

// ---------- busca do resultado via RPC (com retry, pois a sincronização
// do tablet pode levar alguns segundos após o fim do quiz) ----------
async function buscarResultado(token) {
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/buscar_resultado_individual`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify({ token_input: token }),
  });
  if (!resp.ok) throw new Error("falha na consulta: " + resp.status);
  const linhas = await resp.json();
  return linhas && linhas.length > 0 ? linhas[0] : null;
}

function extrairTokenDaURL() {
  const padraoUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  // Aceita as duas formas, porque a hospedagem define qual é possível:
  //   1) ?t=TOKEN            -> funciona em qualquer lugar, inclusive
  //                             GitHub Pages, que não faz reescrita de rota
  //   2) /resultado/TOKEN    -> mais bonito, exige regra de rewrite no
  //                             servidor (Netlify, Vercel, S3+CloudFront)
  const daQuery = new URLSearchParams(window.location.search).get("t");
  if (daQuery && padraoUUID.test(daQuery)) return daQuery;

  const partes = window.location.pathname.split("/").filter(Boolean);
  const ultimo = partes[partes.length - 1] || "";
  const semExtensao = ultimo.replace(/\.html?$/i, "");
  return padraoUUID.test(semExtensao) ? semExtensao : null;
}

function mostrarErro(titulo, corpo, comRetentar) {
  const wrap = $("#wrap");
  wrap.innerHTML = `
    <div class="estado-central">
      <div class="texto-revelacao">${titulo}</div>
      <p>${corpo}</p>
      ${comRetentar ? '<button class="btn btn-primario" id="btnRetentar">Tentar de novo</button>' : ""}
    </div>
  `;
  if (comRetentar) $("#btnRetentar").addEventListener("click", iniciar);
}

async function aguardarResultadoComRetry(token) {
  for (let i = 0; i < TENTATIVAS_MAX; i++) {
    try {
      const r = await buscarResultado(token);
      if (r) return r;
    } catch (e) {
      // segue tentando — problema de rede momentâneo não deve travar
      // a experiência antes das tentativas se esgotarem
    }
    if (i === 0) {
      const el = $("#textoRevelacao");
      if (el) el.textContent = "Ainda registrando seu resultado...";
    }
    await new Promise((res) => setTimeout(res, INTERVALO_TENTATIVA_MS));
  }
  return null;
}

function renderizarResultado(dados) {
  const respostas = dados.respostas || [];
  const eixosCertos = respostas.filter((r) => r.status === "certo").map((r) => r.eixo);
  const eixosErrados = respostas.filter((r) => r.status !== "certo");
  const perfil = obterPerfil(eixosCertos);

  // dedup de cursos recomendados entre as questões erradas (mesmo critério
  // do motor de feedback: nunca repetir o mesmo curso)
  const cursosVistos = new Set();
  const conexoes = [];
  eixosErrados.forEach((r) => {
    const chave = r.curso_indicado || r.trilha_bumerangue || r.eixo;
    if (cursosVistos.has(chave)) return;
    cursosVistos.add(chave);
    conexoes.push(r);
  });

  const wrap = $("#wrap");
  wrap.innerHTML = `
    <div class="secao" style="margin-top:6px">
      <div class="eyebrow">Descoberta</div>
      <div class="perfil-nome">🧠 ${perfil.nome}</div>
      <p class="perfil-desc">${perfil.descricao}</p>
    </div>

    <div class="secao">
      <div class="eyebrow">Desempenho</div>
      <div class="metricas-grid">
        <div class="metrica-card"><div class="metrica-valor">${dados.total_acertos}/3</div><div class="metrica-rotulo">Acertos</div></div>
        <div class="metrica-card"><div class="metrica-valor">${formatarTempo(dados.tempo_total_segundos)}</div><div class="metrica-rotulo">Tempo</div></div>
        <div class="metrica-card"><div class="metrica-valor">${dados.pontuacao}</div><div class="metrica-rotulo">Pontuação</div></div>
        <div class="metrica-card"><div class="metrica-valor">#${dados.posicao_ranking}</div><div class="metrica-rotulo">No ranking</div></div>
      </div>
      ${dados.elegivel_sorteio ? '<p class="perfil-desc" style="margin-top:14px">🎉 Você concorreu ao sorteio do dia da sua participação.</p>' : ""}
    </div>

    ${
      eixosCertos.length > 0
        ? `<div class="secao">
        <div class="eyebrow">⚡ Suas forças</div>
        <div class="forcas-lista">
          ${eixosCertos
            .map(
              (eixo) => `
            <div class="forca-item">
              <span class="forca-ponto" aria-hidden="true"></span>
              <span class="forca-nome">${eixo}</span>
              <span class="forca-barra-wrap"><span class="forca-barra" style="width:100%"></span></span>
            </div>`
            )
            .join("")}
        </div>
      </div>`
        : ""
    }

    ${
      conexoes.length > 0
        ? `<div class="secao">
        <div class="eyebrow">🔗 Novas conexões</div>
        <p class="perfil-desc" style="margin-top:0">Encontramos alguns pontos que podem ficar ainda mais fortes.</p>
        <div class="deck-cards" id="deckCards">
          ${conexoes
            .map(
              (c, i) => `
            <div class="card-conexao" data-idx="${i}" tabindex="0" role="button" aria-expanded="false">
              <div class="card-conexao-topo">
                <span class="card-conexao-icone">${ICONE_CADEADO}</span>
                <div>
                  <div class="card-conexao-titulo">Conexão #${String(i + 1).padStart(2, "0")} — ${c.eixo}</div>
                  <div class="card-conexao-sub">Toque para desbloquear</div>
                </div>
              </div>
              <div class="card-conexao-corpo">
                <div class="card-conexao-linha">Essa resposta revela uma oportunidade de reforçar seu conhecimento em <b>${c.eixo}</b>.</div>
                ${c.trilha_bumerangue ? `<div class="card-conexao-linha">Trilha relacionada: <b>${c.trilha_bumerangue}</b></div>` : ""}
                ${c.curso_indicado ? `<div class="card-conexao-linha">Curso recomendado: <b>${c.curso_indicado}</b></div>` : ""}
                ${c.link_curso ? `<a class="card-conexao-cta" href="${c.link_curso}" target="_blank" rel="noopener">Começar trilha →</a>` : ""}
              </div>
            </div>`
            )
            .join("")}
        </div>
      </div>`
        : ""
    }

    <div class="card-resumo">
      <div class="card-resumo-titulo">Mapa de Sinapses</div>
      <div class="card-resumo-perfil">${perfil.nome}</div>
      <div class="card-resumo-linha">
        <div><b>${dados.pontuacao}</b>pontos</div>
        <div><b>${dados.total_acertos}/3</b>acertos</div>
        <div><b>#${dados.posicao_ranking}</b>ranking</div>
      </div>
    </div>

    <div class="acoes-finais">
      <button class="btn btn-primario" id="btnSalvarCard">Salvar meu card</button>
      <a class="btn btn-secundario" style="text-align:center; text-decoration:none" href="${URL_RANKING_COMPLETO}">Ver ranking completo →</a>
    </div>

    <div class="rodape-marca">SINAPSE COMERCIAL · ADEMICON</div>
  `;

  // interação de desbloqueio dos cards de desenvolvimento
  document.querySelectorAll(".card-conexao").forEach((card) => {
    const abrir = () => {
      const jaAberto = card.classList.contains("aberto");
      card.classList.toggle("aberto");
      card.setAttribute("aria-expanded", String(!jaAberto));
      const sub = card.querySelector(".card-conexao-sub");
      if (!jaAberto) sub.textContent = "Conexão desbloqueada";
    };
    card.addEventListener("click", abrir);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        abrir();
      }
    });
  });

  $("#btnSalvarCard").addEventListener("click", () => salvarCardComoImagem(dados, perfil));
}

// ---------- geração do card colecionável como imagem (canvas, sem libs) ----------
function salvarCardComoImagem(dados, perfil) {
  const canvas = document.createElement("canvas");
  const escala = 3; // resolução maior para ficar nítido ao compartilhar
  canvas.width = 360 * escala;
  canvas.height = 480 * escala;
  const ctx = canvas.getContext("2d");
  ctx.scale(escala, escala);

  const grad = ctx.createLinearGradient(0, 0, 360, 480);
  grad.addColorStop(0, "#171515");
  grad.addColorStop(1, "#0E0D0D");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 360, 480);

  ctx.strokeStyle = "#231F20";
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 340, 460);

  ctx.fillStyle = "#FF0000";
  ctx.font = "bold 11px -apple-system, Arial";
  ctx.textAlign = "center";
  ctx.fillText("MAPA DE SINAPSES", 180, 60);

  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 26px -apple-system, Arial";
  ctx.fillText(perfil.nome, 180, 100);

  ctx.font = "bold 34px -apple-system, Arial";
  ctx.fillText(String(dados.pontuacao), 180, 230);
  ctx.font = "11px -apple-system, Arial";
  ctx.fillStyle = "#DCDDDE";
  ctx.fillText("PONTOS", 180, 250);

  ctx.font = "bold 16px -apple-system, Arial";
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(`${dados.total_acertos}/3 acertos`, 180, 300);
  ctx.fillText(`#${dados.posicao_ranking} no ranking`, 180, 330);

  ctx.font = "10px -apple-system, Arial";
  ctx.fillStyle = "#414042";
  ctx.fillText("SINAPSE COMERCIAL · ADEMICON", 180, 440);

  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "meu-mapa-de-sinapses.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, "image/png");
}

// ---------- sequência de revelação (curta, elegante, pula se prefers-reduced-motion) ----------
async function tocarSequenciaRevelacao() {
  const textoEl = $("#textoRevelacao");
  if (reducedMotion()) return;
  const passos = ["Analisando suas respostas...", "Mapeando seu perfil...", "Seu mapa está pronto."];
  for (let i = 1; i < passos.length; i++) {
    await new Promise((res) => setTimeout(res, 700));
    if (textoEl) textoEl.textContent = passos[i];
  }
  await new Promise((res) => setTimeout(res, 500));
}

async function iniciar() {
  const wrap = $("#wrap");
  wrap.innerHTML = `
    <div class="estado-central" id="estadoCarregando">
      <div class="spinner-sinapse" aria-hidden="true">
        <svg viewBox="0 0 60 60"><g fill="none" stroke="#FF0000" stroke-width="3" stroke-linecap="round">
          <circle cx="30" cy="30" r="24" stroke-dasharray="40 90" opacity=".8"/>
        </g></svg>
      </div>
      <div class="texto-revelacao" id="textoRevelacao" role="status" aria-live="polite">Analisando suas respostas...</div>
    </div>
  `;

  if (SUPABASE_URL.indexOf("SEU-PROJETO") !== -1) {
    mostrarErro(
      "Ainda não configurado",
      "Esta página precisa da URL e da chave do Supabase preenchidas no topo do arquivo antes de funcionar.",
      false
    );
    return;
  }

  const token = extrairTokenDaURL();
  if (!token) {
    mostrarErro("Link incompleto", "Este link não contém um resultado válido. Confira o QR Code e tente escanear novamente.", false);
    return;
  }

  const [dados] = await Promise.all([aguardarResultadoComRetry(token), tocarSequenciaRevelacao()]);

  if (!dados) {
    mostrarErro(
      "Ainda processando",
      "Seu resultado está sendo registrado. Aguarde alguns segundos e tente de novo — ele não se perde, só está a caminho.",
      true
    );
    return;
  }

  renderizarResultado(dados);
}

iniciar();
</script>
