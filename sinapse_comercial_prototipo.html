// ---------- pergunta ----------
function renderPergunta() {
  const q = ESTADO.perguntas[ESTADO.indiceAtual];
  const letras = Object.keys(q.alternativas);
  const ordemEmbaralhada = embaralhar(letras);
  const total = ESTADO.perguntas.length;

  montar(`
    <div class="progresso-sinapse">
      ${Array.from({ length: total })
        .map((_, i) => {
          const estado = i < ESTADO.indiceAtual ? "concluido" : i === ESTADO.indiceAtual ? "atual" : "pendente";
          const conector = i < total - 1 ? `<span class="progresso-linha ${i < ESTADO.indiceAtual ? "concluido" : ""}"></span>` : "";
          return `<span class="progresso-no ${estado}"></span>${conector}`;
        })
        .join("")}
    </div>
    <div class="pergunta-topo">
      <span class="tag-eixo">${q.eixo}</span>
      <div class="anel-tempo-wrap" id="anelTempoWrap" role="timer" aria-live="off">
        <svg class="anel-tempo-svg" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="anel-tempo-trilha" cx="32" cy="32" r="28"/>
          <circle class="anel-tempo-progresso" id="anelTempoProgresso" cx="32" cy="32" r="28"/>
        </svg>
        <div class="anel-tempo-numero" id="anelTempoNumero">${CONFIG.TEMPO_POR_PERGUNTA}</div>
      </div>
      <span class="contador-perguntas">DESAFIO ${String(ESTADO.indiceAtual + 1).padStart(2, "0")}/${String(total).padStart(2, "0")}</span>
    </div>
    <div class="pergunta-texto">${q.pergunta}</div>

    <div class="rede-pergunta" id="redePergunta">
      <div class="rede-nucleo" id="redeNucleo">
        <svg viewBox="0 0 60 60" class="rede-nucleo-svg">
          <defs>
            <radialGradient id="nucleoQuizGrad">
              <stop offset="0%" stop-color="#FF6A5C"/>
              <stop offset="55%" stop-color="#FF0000"/>
              <stop offset="100%" stop-color="#7A1315"/>
            </radialGradient>
          </defs>
          <circle class="nucleo-quiz" cx="30" cy="30" r="22" fill="url(#nucleoQuizGrad)"/>
          <path class="nucleo-quiz-raio" d="M30 18 L23 33 L29 33 L26 44 L37 27 L31 27 Z" fill="#FFFFFF"/>
        </svg>
      </div>

      <svg class="rede-svg-linhas" id="redeSvgLinhas" preserveAspectRatio="none">
        <!-- linhas e nós desenhados via JS em runtime baseado nas posições reais dos botões -->
      </svg>

      <div class="alt-nos-coluna" id="altNosColuna">
        ${ordemEmbaralhada
          .map(
            (letra) => `
          <button class="alt-no" data-letra="${letra}">
            <span class="alt-no-letra">${letra}</span>
            <span class="alt-no-texto">${q.alternativas[letra]}</span>
          </button>`
          )
          .join("")}
      </div>
    </div>

    <div class="micro-feedback" id="microFeedback"></div>
  `);

  // desenha as linhas SVG conectando o núcleo a cada botão-nó em runtime,
  // usando as posições reais do DOM (funciona em qualquer viewport, sem
  // depender de coordenadas hardcoded que podem quebrar se o layout flexionar)
  requestAnimationFrame(desenharLinhasRede);
  window.addEventListener("resize", desenharLinhasRede);

  ESTADO.tempoRestante = CONFIG.TEMPO_POR_PERGUNTA;
  ESTADO.inicioPergunta = Date.now();

  // anel de energia: o contorno vai se esvaziando conforme o tempo passa.
  // stroke-dashoffset animado por CSS (transition linear de 1s) acompanha
  // exatamente o passo do setInterval, sem precisar de animação por frame.
  const anelWrap = $("#anelTempoWrap");
  const anelProgresso = $("#anelTempoProgresso");
  const anelNumero = $("#anelTempoNumero");
  const CIRCUNFERENCIA = 2 * Math.PI * 28; // r=28 no viewBox do SVG
  if (anelProgresso) {
    anelProgresso.style.strokeDasharray = CIRCUNFERENCIA.toFixed(2);
    anelProgresso.style.strokeDashoffset = "0";
  }

  ESTADO.timerId = setInterval(() => {
    ESTADO.tempoRestante -= 1;
    const fracao = Math.max(0, ESTADO.tempoRestante / CONFIG.TEMPO_POR_PERGUNTA);
    if (anelProgresso) {
      anelProgresso.style.strokeDashoffset = (CIRCUNFERENCIA * (1 - fracao)).toFixed(2);
    }
    if (anelNumero) anelNumero.textContent = Math.max(0, ESTADO.tempoRestante);
    if (ESTADO.tempoRestante <= 5 && anelWrap) anelWrap.classList.add("critico");
    if (ESTADO.tempoRestante <= 0) {
      clearInterval(ESTADO.timerId);
      registrarResposta(null, true);
    }
  }, 1000);

  $$(".alt-no").forEach((btn) => {
    comHoverSutil(btn);
    // ao aproximar/tocar uma alternativa, a rede reage discretamente
    btn.addEventListener("pointerenter", () => despertarSinapse({ duracaoMs: 600, sementes: 1 }));
    btn.addEventListener("click", () => {
      clearInterval(ESTADO.timerId);
      somSelecao();
      // DECISÃO TOMADA: a informação percorre a rede
      despertarSinapse({ duracaoMs: 1800, sementes: 6 });
      registrarResposta(btn.dataset.letra, false);
    });
  });
}

// desenha as linhas SVG e os nós satélite conectando o núcleo (posição fixa
// à esquerda) a cada botão-nó (posição real medida do DOM). Chamada no
// primeiro frame após renderizar a pergunta e a cada resize da janela.
function desenharLinhasRede() {
  const rede = $("#redePergunta");
  const nucleo = $("#redeNucleo");
  const svg = $("#redeSvgLinhas");
  const botoes = $$(".alt-no");
  if (!rede || !nucleo || !svg || botoes.length === 0) return;

  const redeRect = rede.getBoundingClientRect();
  const nucleoRect = nucleo.getBoundingClientRect();
  const largura = redeRect.width;
  const altura = redeRect.height;
  svg.setAttribute("viewBox", `0 0 ${largura} ${altura}`);
  svg.setAttribute("width", largura);
  svg.setAttribute("height", altura);

  // ponto de origem: centro-direita do núcleo (para as linhas saírem "de dentro" dele)
  const x1 = nucleoRect.left - redeRect.left + nucleoRect.width / 2;
  const y1 = nucleoRect.top - redeRect.top + nucleoRect.height / 2;

  const svgNS = "http://www.w3.org/2000/svg";
  let html = "";
  botoes.forEach((btn) => {
    const btnRect = btn.getBoundingClientRect();
    // ponto de destino: borda esquerda-central de cada botão
    const x2 = btnRect.left - redeRect.left;
    const y2 = btnRect.top - redeRect.top + btnRect.height / 2;
    const letra = btn.dataset.letra;
    html += `<line class="linha-alt" id="linhaAlt-${letra}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    html += `<circle class="no-alt" id="noAlt-${letra}" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="7"/>`;
    html += `<circle class="pulso-linha-alt" id="pulsoAlt-${letra}" r="4" cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" opacity="0"/>`;
  });
  svg.innerHTML = html;
}

function dispararPulsoLinha(letra, contexto) {
  try {
    const pulso = document.getElementById("pulsoAlt-" + letra);
    const linha = document.getElementById("linhaAlt-" + letra);
    if (!pulso || !linha) return;
    const x1 = parseFloat(linha.getAttribute("x1"));
    const y1 = parseFloat(linha.getAttribute("y1"));
    const x2 = parseFloat(linha.getAttribute("x2"));
    const y2 = parseFloat(linha.getAttribute("y2"));
    // remove qualquer animação anterior antes de recriar
    Array.from(pulso.querySelectorAll("animateMotion, animate")).forEach((el) => el.remove());

    const svgNS = "http://www.w3.org/2000/svg";
    const motion = document.createElementNS(svgNS, "animateMotion");
    motion.setAttribute("dur", contexto === "circuito" ? "0.7s" : "0.5s");
    motion.setAttribute("begin", "0s");
    motion.setAttribute("fill", "freeze");
    motion.setAttribute("path", `M${x2},${y2} L${x1},${y1}`); // do nó pro núcleo (impulso viajando pra dentro)
    const fade = document.createElementNS(svgNS, "animate");
    fade.setAttribute("attributeName", "opacity");
    fade.setAttribute("dur", motion.getAttribute("dur"));
    fade.setAttribute("begin", "0s");
    fade.setAttribute("values", "0;1;1;0");
    fade.setAttribute("fill", "freeze");
    pulso.appendChild(motion);
    pulso.appendChild(fade);
    if (motion.beginElement) motion.beginElement();
    if (fade.beginElement) fade.beginElement();
  } catch (e) {
    /* animação SMIL indisponível — feedback estático continua funcionando */
  }
}

function registrarResposta(letraEscolhida, tempoEsgotado) {
  const q = ESTADO.perguntas[ESTADO.indiceAtual];
  const tempoRespostaSeg = (Date.now() - ESTADO.inicioPergunta) / 1000;
  const correta = !tempoEsgotado && letraEscolhida === q.resposta_correta;

  ESTADO.respostas.push({
    questaoId: q.id,
    eixo: q.eixo,
    alternativaEscolhida: tempoEsgotado ? null : letraEscolhida,
    respostaCorreta: q.resposta_correta,
    status: tempoEsgotado ? "tempo_esgotado" : correta ? "certo" : "errado",
    tempoSegundos: Math.round(tempoRespostaSeg * 10) / 10,
    nivelDificuldade: q.nivel_dificuldade || null,
    cursoIndicado: q.curso_indicado || null,
    trilhaBumerangue: q.trilha_bumerangue || null,
    linkCurso: q.link_curso || null,
  });

  // feedback visual imediato — circuito de energia se acende
  const letrasAlt = Object.keys(q.alternativas);
  const linhaEscolhida = letraEscolhida ? $("#linhaAlt-" + letraEscolhida) : null;
  const linhaCorreta = $("#linhaAlt-" + q.resposta_correta);
  const noEscolhido = letraEscolhida ? $("#noAlt-" + letraEscolhida) : null;
  const noCorreto = $("#noAlt-" + q.resposta_correta);
  const btnEscolhido = letraEscolhida ? document.querySelector(`.alt-no[data-letra="${letraEscolhida}"]`) : null;
  const btnCorreto = document.querySelector(`.alt-no[data-letra="${q.resposta_correta}"]`);

  $$(".alt-no").forEach((btn) => {
    btn.disabled = true;
  });

  // fase 1: linha do escolhido "acende" imediatamente, com energia viajando
  // pela linha da resposta escolhida (impulso saindo do nó escolhido em
  // direção ao núcleo)
  if (linhaEscolhida) linhaEscolhida.classList.add("linha-ativada");
  if (noEscolhido) noEscolhido.classList.add("no-ativado");
  if (btnEscolhido) btnEscolhido.classList.add("selecionada");
  if (letraEscolhida) dispararPulsoLinha(letraEscolhida, "escolhido");

  // fase 2: 400ms depois, o veredito visual — se certo, TODAS as linhas
  // acendem (o circuito completo se ilumina); se errado, a linha da
  // correta acende em contraste, com a escolhida se atenuando
  setTimeout(() => {
    if (correta) {
      letrasAlt.forEach((letra) => {
        const linha = $("#linhaAlt-" + letra);
        const no = $("#noAlt-" + letra);
        if (linha) linha.classList.add("linha-circuito-completo");
        if (no) no.classList.add("no-circuito-completo");
        dispararPulsoLinha(letra, "circuito");
      });
      const nucleo = document.querySelector(".nucleo-quiz");
      if (nucleo) nucleo.classList.add("nucleo-completo");
    } else if (!tempoEsgotado) {
      if (linhaEscolhida) linhaEscolhida.classList.add("linha-esmaecida");
      if (noEscolhido) noEscolhido.classList.add("no-esmaecido");
      if (btnEscolhido) btnEscolhido.classList.add("incorreta-marcada");
      if (linhaCorreta) linhaCorreta.classList.add("linha-correta-revelada");
      if (noCorreto) noCorreto.classList.add("no-correta-revelada");
      if (btnCorreto) btnCorreto.classList.add("correta");
      dispararPulsoLinha(q.resposta_correta, "correta");
    } else {
      // tempo esgotado: só revela a correta, sem contraste com escolhida
      if (linhaCorreta) linhaCorreta.classList.add("linha-correta-revelada");
      if (noCorreto) noCorreto.classList.add("no-correta-revelada");
      if (btnCorreto) btnCorreto.classList.add("correta");
      dispararPulsoLinha(q.resposta_correta, "correta");
    }
  }, 400);

  if (tempoEsgotado) somTempoEsgotado();
  else if (correta) somCorreto();
  else somErrado();
  pulsarFundo();

  const FRASES_CERTO = ["Conexão feita.", "Boa leitura.", "Repertório em ação."];
  const FRASES_ERRADO = ["Outra conexão possível.", "Novo ângulo, mesma direção.", "Segue o jogo."];
  const FRASE_TEMPO = "O tempo passou — a ideia continua.";

  const micro = $("#microFeedback");
  if (micro) {
    const texto = tempoEsgotado
      ? FRASE_TEMPO
      : correta
      ? FRASES_CERTO[ESTADO.indiceAtual % FRASES_CERTO.length]
      : FRASES_ERRADO[ESTADO.indiceAtual % FRASES_ERRADO.length];
    micro.textContent = texto;
    micro.classList.add(correta ? "positivo" : "neutro", "visivel");
  }

  setTimeout(() => {
    mostrarModalFeedback(correta, tempoEsgotado);
  }, 700); // pequena pausa para o destaque da alternativa aparecer antes do pop-up
}

// ---------- pontuação cosmética (não interfere no ranking) ----------
// pesos por dificuldade + pequeno bônus por tempo de resposta. Usada só na
// experiência de resultado individual (mapa de sinapses) — o ranking
// continua sendo exclusivamente acertos desc, tempo asc, como sempre foi.
const PESO_DIFICULDADE = { Fácil: 20, Médio: 30, Difícil: 50 };
function calcularPontuacao(respostas) {
  let pontos = 0;
  for (const r of respostas) {
    if (r.status !== "certo") continue;
    const peso = PESO_DIFICULDADE[r.nivelDificuldade] || 20;
    // bônus proporcional ao tempo restante: quem responde na metade do
    // tempo leva metade do bônus máximo. Deriva de TEMPO_POR_PERGUNTA para
    // não descalibrar quando o tempo da questão mudar (com 45s e um bônus
    // fixo de 15, praticamente ninguém pontuaria no bônus).
    const BONUS_MAXIMO = 20;
    const fracaoRestante = Math.max(0, 1 - r.tempoSegundos / CONFIG.TEMPO_POR_PERGUNTA);
    const bonusTempo = BONUS_MAXIMO * fracaoRestante;
    pontos += peso + Math.round(bonusTempo);
  }
  return pontos;
}

// ---------- finalização + gravação ----------
function finalizarRodada() {
  const acertos = ESTADO.respostas.filter((r) => r.status === "certo").length;
  const tempoTotalSeg = ESTADO.respostas.reduce((soma, r) => soma + r.tempoSegundos, 0);
  const elegivelSorteio = acertos === 3;
  const tipoBrinde = acertos >= 2 ? "especial" : "participacao";
  const pontuacao = calcularPontuacao(ESTADO.respostas);
  // token público da tentativa — é o que vai na URL do QR Code da experiência
  // individual. Deliberadamente gerado aqui (não reaproveita o participanteId
  // nem o participacaoId internos) para nunca misturar identificador exposto
  // publicamente com chave interna de banco.
  const tokenResultado = gerarUUID();

  const registro = {
    ...ESTADO.participante,
    dataHoraParticipacao: agora(),
    respostas: ESTADO.respostas,
    totalAcertos: acertos,
    tempoTotalSegundos: Math.round(tempoTotalSeg * 10) / 10,
    pontuacao,
    tokenResultado,
    elegivelSorteio,
    tipoBrinde,
    brindeEntregue: false,
  };

  const lista = carregarParticipantes();
  lista.push(registro);
  salvarParticipantes(lista);

  // cópia para a fila de sincronização com o Supabase (não afeta o app local
  // em nada — se o backend não estiver configurado ou não houver rede agora,
  // isso só fica guardado e tenta de novo mais tarde)
  enfileirarParaSincronizar({
    participanteId: gerarUUID(),
    participacaoId: gerarUUID(),
    tokenResultado,
    cpf: registro.cpf,
    nome: registro.nome,
    loja: registro.loja,
    estado: registro.estado,
    telefone: registro.telefone,
    email: registro.email,
    lgpdAceito: registro.lgpdAceito,
    lgpdTimestamp: registro.lgpdTimestamp,
    horaInicio: new Date(ESTADO.inicioRodada || Date.now()).toISOString(),
    dataHoraParticipacao: registro.dataHoraParticipacao,
    totalAcertos: registro.totalAcertos,
    tempoTotalSegundos: registro.tempoTotalSegundos,
    pontuacao: registro.pontuacao,
    elegivelSorteio: registro.elegivelSorteio,
    tipoBrinde: registro.tipoBrinde,
    brindeEntregue: registro.brindeEntregue,
    modoTeste: CONFIG.TEST_MODE_PERMITIR_CPF_REPETIDO,
    respostas: registro.respostas.map((r) => ({ ...r, _syncId: gerarUUID() })),
  });
  tentarSincronizarFila(); // best-effort, não bloqueia a tela de feedback

  ESTADO.ultimoResultado = registro;
  ESTADO.tela = "feedback";
  renderizar();
}

function mensagemFeedback(registro) {
  const erradas = registro.respostas.filter((r) => r.status !== "certo");
  const nomeCurso = (c) => c || "(curso a definir)";

  if (registro.totalAcertos === 3) {
    return {
      icone: ICONE_RAIO_SVG,
      texto: `Sua sinapse comercial está a todo vapor! Você é um consultor de excelência. Continue assim, suas conexões neurais estão no máximo! Você está concorrendo ao sorteio de hoje. Boa sorte!`,
    };
  }
  if (registro.totalAcertos === 2) {
    const c = erradas[0];
    return {
      icone: ICONE_CONEXAO_SVG,
      texto: `Quase lá! Sua sinapse comercial está forte, mas identificamos um ponto de conexão que pode ser reforçado. Recomendamos o curso <b>${nomeCurso(c.cursoIndicado)}</b> na Bumerangue para fortalecer essa área.`,
    };
  }
  if (registro.totalAcertos === 1) {
    const [e1, e2] = erradas;
    return {
      icone: ICONE_CEREBRO_SVG,
      texto: `Sua sinapse comercial precisa de novas conexões! Identificamos oportunidades de evolução em <b>${e1.eixo}</b> e <b>${e2.eixo}</b>. Acesse os cursos <b>${nomeCurso(e1.cursoIndicado)}</b> e <b>${nomeCurso(e2.cursoIndicado)}</b> na Bumerangue e volte ainda mais preparado.`,
    };
  }
  const link = erradas[0] && erradas[0].linkCurso ? erradas[0].linkCurso : "(link a cadastrar)";
  return {
    icone: ICONE_BATERIA_SVG,
    texto: `Hora de recarregar suas conexões! Sua sinapse comercial tem muito potencial, mas precisa de reforço. Acesse a trilha completa do consultor comercial na Bumerangue: <b>${link}</b>. Cada novo aprendizado cria uma conexão que te faz chegar mais longe.`,
  };
}

// ---------------------------------------------------------------
function exportarCSV() {
  const lista = carregarParticipantes();
  const cabecalho = [
    "cpf", "nome", "loja", "estado", "telefone", "email", "consentimento_lgpd", "data_hora_consentimento",
    "data_hora_participacao", "pergunta_id", "eixo", "alternativa_escolhida", "resposta_correta",
    "status_resposta", "tempo_resposta_segundos", "tempo_total_segundos", "total_acertos",
    "curso_recomendado", "trilha_bumerangue", "link_curso", "elegivel_sorteio", "tipo_brinde", "brinde_entregue",
  ];

  const linhas = [cabecalho.join(";")];
  lista.forEach((p) => {
    p.respostas.forEach((r) => {
      const linha = [
        p.cpf, p.nome, p.loja || "", p.estado || "", p.telefone, p.email, p.lgpdAceito ? "sim" : "nao", p.lgpdTimestamp || "",
        p.dataHoraParticipacao, r.questaoId, r.eixo, r.alternativaEscolhida || "", r.respostaCorreta,
        r.status, r.tempoSegundos, p.tempoTotalSegundos, p.totalAcertos,
        r.cursoIndicado || "", r.trilhaBumerangue || "", r.linkCurso || "",
        p.elegivelSorteio ? "sim" : "nao", p.tipoBrinde, p.brindeEntregue ? "sim" : "nao",
      ].map((v) => `"${String(v).replace(/"/g, '""')}"`);
      linhas.push(linha.join(";"));
    });
  });

  $("#btnAdmin").addEventListener("click", abrirAdmin);

// os pares de logos-sinapse viajam em direções opostas com a mesma duração,
// então SEMPRE se encontram exatamente no meio do fio, a cada ciclo
// completo. Não precisa de detecção de colisão em tempo real — basta
// sincronizar um timer com metade da duração da animação.
function iniciarEncontrosViajantes() {
  const configs = [
    { path: "#fioPath", duracaoMs: 8000 },
    { path: "#fioPath2", duracaoMs: 9500 },
    { path: "#fioPath3", duracaoMs: 7000 },
  ];
  configs.forEach(({ path, duracaoMs }) => {
    const el = $(path);
    if (!el || typeof el.getTotalLength !== "function") return;

    const disparar = () => {
      try {
        const comprimento = el.getTotalLength();
        const pontoSVG = el.getPointAtLength(comprimento / 2);
        const svg = el.closest("svg");
        if (!svg || !svg.getScreenCTM) return;
        const ctm = svg.getScreenCTM();
        if (!ctm) return;
        const pt = svg.createSVGPoint();
        pt.x = pontoSVG.x;
        pt.y = pontoSVG.y;
        const tela = pt.matrixTransform(ctm);
        // explosão pequena e local — é ambientação contínua, não um "wow
        // moment" de tela cheia (esse continua reservado pras transições)
        explodirSinapse({ x: tela.x, y: tela.y, quantidade: 9, raio: 55, duracaoBase: 0.45 });
      } catch (e) {
        /* encontro dos viajantes é só ambientação — nunca deve travar nada */
      }
    };

    setTimeout(() => {
      disparar();
      setInterval(disparar, duracaoMs);
    }, duracaoMs / 2);
  });
}

  inicializarAmbienteFio();
  gerarMalhaNeural();
  iniciarEncontrosViajantes();
  // impulsos elétricos automáticos e contínuos pelo fio — não só nas
  // transições de tela, para a rede parecer viva o tempo todo
  setInterval(dispararFaiscaFio, 3400);
  setInterval(dispararFaiscaFio3, 4200);

  carregarPreferenciaAudio();
  const btnMudo = $("#btnMudo");
  if (btnMudo) {
    btnMudo.textContent = AUDIO_MUTADO ? "🔇" : "🔊";
    btnMudo.addEventListener("click", () => {
      iniciarAudioSeNecessario();
      alternarMudo();
    });
  }
  try {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.body.classList.add("reduz-movimento");
    }
  } catch (e) {
    /* navegador sem suporte a matchMedia — segue sem reduzir animação */
  }
  // sincronização com o Supabase em segundo plano: tenta ao carregar, tenta
  // de novo quando a conexão voltar, e insiste periodicamente. Nunca trava
  // nem depende de nenhuma tela — funciona por baixo o tempo todo.
  tentarSincronizarFila();
  setInterval(tentarSincronizarFila, CONFIG.INTERVALO_SYNC_MS);
  window.addEventListener("online", tentarSincronizarFila);
  renderizar();
});
