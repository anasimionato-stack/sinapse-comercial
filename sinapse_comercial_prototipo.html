<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Sinapse Comercial — Ademicon</title>
<style>
/* ===================================================================
   SINAPSE COMERCIAL — protótipo de teste
   Paleta oficial Ademicon: #FFFFFF #231F20 #414042 #DCDDDE #FF0000 #D03025 #7A1315
   =================================================================== */

:root{
  --preto: #0E0D0D;
  --preto-2: #171515;
  --carvao: #231F20;
  --cinza: #414042;
  --cinza-claro: #DCDDDE;
  --vermelho: #FF0000;
  --vermelho-2: #D03025;
  --vermelho-fundo: #7A1315;
  --branco: #FFFFFF;
  --fonte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 20px;
  /* áreas seguras — nenhum conteúdo de tela pode nascer dentro delas.
     logo+badge ficam no topo, admin+mudo no rodapé; todo o resto do
     layout reserva esse espaço para nunca sobrepor esses elementos. */
  --area-topo: 96px;
  --area-rodape: 78px;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  height:100%;
  background:var(--preto);
  color:var(--branco);
  font-family:var(--fonte);
  overflow:hidden;
}

body{
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(255,0,0,.10), transparent 60%),
    radial-gradient(ellipse 900px 700px at 110% 110%, rgba(122,19,21,.22), transparent 55%),
    var(--preto);
}

#app{
  height:100vh;
  width:100vw;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:0;
}

#conteudo{
  position:relative;
  z-index:2;
  width:100%;
  /* com o fundo neural em opacidade alta, o texto ganha uma sombra própria
     em vez de depender de escurecer a imagem toda. Protege a leitura
     localmente, mantendo a rede viva atrás. */
  text-shadow:0 1px 3px rgba(14,13,13,.9), 0 0 18px rgba(14,13,13,.65);
}

.tela{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  /* "safe center" centraliza quando o conteúdo cabe, mas alinha ao topo
     quando ele transborda. Sem isso, o flexbox com justify-content:center
     estoura para CIMA e para baixo ao mesmo tempo, e o topo do conteúdo
     entra por baixo do logo em vez de rolar — foi exatamente o que passou
     a acontecer quando a fonte arcade deixou o conteúdo mais alto. */
  justify-content:center;
  justify-content:safe center;
  padding:max(6vh, var(--area-topo)) 6vw max(4vh, var(--area-rodape));
  box-sizing:border-box;
  overflow-y:auto;
  animation:entra .45s ease both;
}
/* fallback para navegadores sem "safe center": o auto nas margens do
   primeiro e do último filho produz o mesmo efeito de centralizar sem
   cortar o topo */
.tela > *:first-child{margin-top:auto;}
.tela > *:last-child{margin-bottom:auto;}

@keyframes entra{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}

.reduz-movimento *{animation-duration:.001s !important; transition-duration:.001s !important;}

/* ---------- topo com logo ---------- */
.topo-logo{
  position:absolute;
  top:4vh;
  left:50%;
  transform:translateX(-50%);
  height:46px;
  opacity:.92;
  z-index:5;      /* acima do conteúdo: nunca pode ficar por baixo */
}
.topo-logo img{height:100%; display:block;}

.badge-teste{
  position:absolute;
  top:4vh;
  right:4vw;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--vermelho);
  border:1px solid rgba(255,0,0,.5);
  padding:5px 10px;
  border-radius:999px;
  background:rgba(255,0,0,.08);
  font-weight:700;
  z-index:2;
}

/* ---------- ícone sinapse ---------- */
.icone-wrap{position:relative; width:220px; height:220px; margin-bottom:2.2rem;}
.icone-wrap svg{width:100%; height:100%; display:block;}

.no-satelite{animation:acender 2.4s ease-in-out infinite;}
.no-satelite.n1{animation-delay:0s;}
.no-satelite.n2{animation-delay:.25s;}
.no-satelite.n3{animation-delay:.5s;}
@keyframes acender{
  0%,100%{opacity:.55; transform:scale(1);}
  50%{opacity:1; transform:scale(1.12);}
}

.nucleo{animation:pulsar 2.4s ease-in-out infinite; transform-origin:100px 100px;}
@keyframes pulsar{
  0%,100%{filter:drop-shadow(0 0 6px rgba(255,0,0,.55));}
  50%{filter:drop-shadow(0 0 22px rgba(255,0,0,.95));}
}

.icone-wrap.flash .nucleo{animation:faisca .55s ease-out;}
@keyframes faisca{
  0%{filter:drop-shadow(0 0 6px rgba(255,255,255,.9)); transform:scale(1);}
  40%{filter:drop-shadow(0 0 40px rgba(255,255,255,1)); transform:scale(1.18);}
  100%{filter:drop-shadow(0 0 6px rgba(255,0,0,.55)); transform:scale(1);}
}

/* ---------- tipografia ---------- */
h1{
  font-size:clamp(28px, 4.4vw, 52px);
  font-weight:800;
  letter-spacing:-.01em;
  text-align:center;
  line-height:1.08;
}
h1 span{color:var(--vermelho);}

.tagline{
  margin-top:.7rem;
  color:var(--cinza-claro);
  font-size:clamp(14px,1.6vw,19px);
  text-align:center;
  max-width:640px;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:12.5px;
  font-weight:700;
  color:var(--vermelho);
  margin-bottom:.6rem;
}

p.corpo{color:var(--cinza-claro); font-size:16px; text-align:center; max-width:560px; line-height:1.5;}

/* ---------- botões ---------- */
.btn{
  appearance:none;
  border:none;
  cursor:pointer;
  font-family:var(--fonte);
  font-weight:700;
  font-size:19px;
  padding:20px 46px;
  border-radius:999px;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primario{
  background:linear-gradient(135deg, var(--vermelho), var(--vermelho-2));
  color:var(--branco);
  box-shadow:0 8px 30px rgba(255,0,0,.35);
}
.btn-primario:disabled{opacity:.35; box-shadow:none; cursor:not-allowed;}
.btn-secundario{
  background:transparent;
  color:var(--cinza-claro);
  border:1.5px solid var(--cinza);
}
.btn-bloco{width:100%; text-align:center;}

.acoes{margin-top:2.6rem; display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}

/* ---------- formulário ---------- */
.form-card{width:100%; max-width:520px;}
.campo{margin-bottom:1.1rem;}
.campo label{
  display:block;
  font-size:13px;
  color:var(--cinza-claro);
  margin-bottom:.4rem;
  letter-spacing:.02em;
}
.campo input{
  width:100%;
  padding:16px 18px;
  border-radius:14px;
  border:1.5px solid var(--cinza);
  background:var(--preto-2);
  color:var(--branco);
  font-size:17px;
  font-family:"SinapseArcade", var(--fonte);
  outline:none;
  transition:border-color .15s ease;
}
.campo input:focus{border-color:var(--vermelho);}
.campo input.invalido{border-color:var(--vermelho); box-shadow:0 0 0 3px rgba(255,0,0,.15);}
.erro-campo{color:#FF6B5E; font-size:12.5px; margin-top:.35rem; min-height:14px;}
.dica-campo{color:var(--cinza); font-size:12px; margin-top:.35rem;}

.aviso-cpf-repetido{
  background:rgba(255,0,0,.08);
  border:1px solid rgba(255,0,0,.35);
  border-radius:14px;
  padding:14px 18px;
  color:var(--cinza-claro);
  font-size:14.5px;
  margin-top:1rem;
  text-align:center;
}
.aviso-cpf-repetido.aviso-cpf-teste{
  background:rgba(220,221,222,.06);
  border-color:var(--cinza);
}

/* ---------- LGPD ---------- */
.lgpd-texto{
  max-width:560px;
  background:var(--preto-2);
  border:1px solid var(--cinza);
  border-radius:16px;
  padding:22px 24px;
  color:var(--cinza-claro);
  font-size:14.5px;
  line-height:1.6;
  max-height:32vh;
  overflow-y:auto;
}
.checkbox-linha{
  display:flex;
  align-items:flex-start;
  gap:12px;
  max-width:560px;
  margin-top:1.3rem;
  cursor:pointer;
}
.checkbox-linha input{width:22px; height:22px; margin-top:2px; accent-color:var(--vermelho); flex-shrink:0;}
/* a fonte arcade precisa de entrelinha folgada: sem line-height próprio
   as duas linhas do aceite quase encostavam uma na outra */
.checkbox-linha span{font-size:10px; line-height:1.95; letter-spacing:-.02em; color:var(--cinza-claro);}
@media (max-width:520px){ .checkbox-linha span{font-size:8.5px; line-height:1.9;} }
@media (min-width:1400px){ .checkbox-linha span{font-size:14px; line-height:2;} }

/* ---------- fio condutor (background, atravessa toda a experiência) ---------- */
.fio-condutor-layer{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  opacity:.85;
  transition:opacity 1.4s ease;
}
.fio-svg{
  width:100%; height:100%; display:block;
  animation:fioRespiro 9s ease-in-out infinite;
}
@keyframes fioRespiro{
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(1.4);}
}

/* pulso sinestésico — sincroniza o fundo com os efeitos sonoros do app
   (contagem, respostas, ativação). Usa filter, não opacity, então nunca
   conflita com a intensidade por tela definida acima. */
.fio-condutor-layer.pulso-sinc{
  animation:fioPulsoSinc .45s ease-out;
}
@keyframes fioPulsoSinc{
  0%{filter:brightness(1);}
  35%{filter:brightness(1.9);}
  100%{filter:brightness(1);}
}
@media (prefers-reduced-motion: reduce){
  .fio-svg{animation:none;}
  .fio-condutor-layer.pulso-sinc{animation:none;}
}

.fio-caminho{
  fill:none;
  stroke:#FF0000;
  stroke-width:1.8;
  stroke-linecap:round;
  opacity:.8;
  stroke-dasharray:5 10;
  animation:fioFluxo 15s linear infinite;
  filter:drop-shadow(0 0 2px rgba(255,0,0,.4));
}
@keyframes fioFluxo{ to{ stroke-dashoffset:-400; } }

/* segundo fio — mais fino, mais apagado e mais lento que o principal.
   É a camada "mais ao fundo" que dá profundidade sem duplicar o efeito. */
.fio-caminho-fundo{
  stroke:var(--vermelho-fundo);
  stroke-width:1.3;
  opacity:.55;
  stroke-dasharray:3 13;
  animation-duration:24s;
  animation-direction:reverse;
}

/* terceiro fio — mais grosso e mais iluminado, a "fibra principal" em
   primeiro plano, com brilho mais forte que os outros dois */
.fio-caminho-principal{
  stroke-width:2.4;
  opacity:.9;
  stroke-dasharray:7 9;
  animation-duration:19s;
  filter:drop-shadow(0 0 4px rgba(255,0,0,.55));
}

/* neblina atmosférica — manchas radiais muito suaves que derivam devagar,
   dão volumetria ao escuro entre as conexões sem introduzir nenhuma cor
   nova (só vermelho da marca, em opacidade quase imperceptível) */
.fio-neblina{
  position:absolute;
  inset:-10%;
  pointer-events:none;
  background:
    radial-gradient(ellipse 45% 30% at 20% 25%, rgba(255,0,0,.10), transparent 70%),
    radial-gradient(ellipse 40% 35% at 80% 70%, rgba(255,0,0,.08), transparent 70%),
    radial-gradient(ellipse 50% 40% at 50% 95%, rgba(122,19,21,.14), transparent 70%);
  filter:blur(40px);
  animation:neblinaDeriva 26s ease-in-out infinite alternate;
}
@keyframes neblinaDeriva{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(-2%,3%) scale(1.06);}
}
@media (prefers-reduced-motion: reduce){
  .fio-neblina{animation:none;}
}

.fio-faisca{filter:url(#fioBrilho);}

/* logos-sinapse viajando pelos fios — brilho vermelho vibrante, mais forte
   que os pontos de conexão parados, porque são o elemento "vivo" da rede */
.viajante-sinapse{
  filter:drop-shadow(0 0 4px rgba(255,0,0,.9)) drop-shadow(0 0 8px rgba(255,0,0,.5));
}
.viajante-sinapse.viajante-grande{
  filter:drop-shadow(0 0 5px rgba(255,0,0,1)) drop-shadow(0 0 10px rgba(255,0,0,.6));
}

.ponto-fio{
  fill:#DCDDDE;
  opacity:.75;
  filter:drop-shadow(0 0 6px rgba(255,0,0,.6));
  animation:pontoFioRespira 3.6s ease-in-out infinite;
}
@keyframes pontoFioRespira{
  0%,100%{opacity:.5; r:2.2;}
  50%{opacity:1; r:3.2;}
}
  0%,100%{opacity:.35; r:2;}
  50%{opacity:.8; r:2.6;}
}

/* campo de pontos ambiente persistente — bem esparso, some no fundo,
   reforça a sensação de rede acontecendo continuamente. Usa só as cores
   já existentes (vermelho da marca e o cinza claro), nada novo. */
.fio-ambiente{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.ponto-fio-ambiente{
  position:absolute;
  border-radius:50%;
  opacity:var(--op-alvo, .18);
  animation-name:derivaAmbiente;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
.ponto-fio-ambiente.fio-quente{
  background:var(--vermelho);
  box-shadow:0 0 4px rgba(255,0,0,.45);
}
.ponto-fio-ambiente.fio-frio{
  background:var(--cinza-claro);
}
.ponto-fio-ambiente.dendrito-ambiente{
  background:none;
  box-shadow:none;
  border-radius:0;
}

/* intensidade varia discretamente conforme o momento da experiência —
   mais presente em telas de transição/resultado, mais discreto onde o
   foco precisa estar 100% no conteúdo (pergunta) */
.fio-condutor-layer[data-tela="inicial"]{opacity:1;}
.fio-condutor-layer[data-tela="ativacao"]{opacity:1;}
.fio-condutor-layer[data-tela="contagem"]{opacity:1;}
.fio-condutor-layer[data-tela="pergunta"]{opacity:.9;}
.fio-condutor-layer[data-tela="feedback"]{opacity:1;}
.fio-condutor-layer[data-tela="ranking"]{opacity:.95;}

@media (prefers-reduced-motion: reduce){
  .fio-caminho{animation:none;}
  .ponto-fio{animation:none;}
  .ponto-fio-ambiente{animation:none;}
}
/* ---------- burst de sinapses (transições de impacto) ---------- */
.particula-sinapse{
  position:fixed;
  left:var(--origem-x);
  top:var(--origem-y);
  width:11px; height:11px;
  margin-left:-5.5px; margin-top:-5.5px;
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle, var(--cor-nucleo,#fff) 0%, var(--cor-brilho,rgba(255,0,0,.7)) 45%, transparent 74%);
  transform:translate(0,0) scale(.25) rotate(0deg);
  animation:particulaVoo var(--dur,.7s) cubic-bezier(.16,.84,.44,1) forwards;
  animation-delay:var(--atraso,0s);
  will-change:transform, opacity;
}
/* duas temperaturas de brilho dentro da paleta da marca — combinam com
   qualquer camada de profundidade via custom property */
.particula-quente{ --cor-nucleo:#FFD9C2; --cor-brilho: rgba(255,90,30,.75); --cor-brilho-fraca: rgba(255,90,30,.35); }
.particula-fria{ --cor-nucleo:#FFFFFF; --cor-brilho: rgba(255,248,240,.7); --cor-brilho-fraca: rgba(255,248,240,.32); }

/* perto da câmera: grandes, nítidas, com bloom mais forte (tipo "estrela") */
.particula-perto{
  z-index:46;
  filter:
    drop-shadow(0 0 9px var(--cor-brilho, rgba(255,60,40,.7)))
    drop-shadow(0 0 22px var(--cor-brilho-fraca, rgba(255,60,40,.4)));
}
/* primeiro plano: nítidas, na frente do conteúdo da tela */
.particula-frente{
  z-index:45;
  filter:drop-shadow(0 0 3px var(--cor-brilho, rgba(255,0,0,.35)));
}
/* ao fundo: menores, atrás do conteúdo, desfocadas — cria profundidade */
.particula-fundo{
  z-index:1;
  filter:blur(.8px) drop-shadow(0 0 3px var(--cor-brilho, rgba(255,0,0,.3)));
  opacity:.65;
}
@keyframes particulaVoo{
  0%{opacity:0; transform:translate(0,0) scale(.25) rotate(0deg);}
  12%{opacity:1;}
  70%{opacity:.85;}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(var(--escala,.6)) rotate(var(--rot,0deg));}
}

/* acúmulo de energia — flash rápido no núcleo antes da rede se espalhar */
.acumulando-energia .nucleo{
  animation:acumuloEnergia .32s ease-out !important;
}
@keyframes acumuloEnergia{
  0%{filter:drop-shadow(0 0 6px rgba(255,0,0,.5)); transform:scale(1);}
  70%{filter:drop-shadow(0 0 44px rgba(255,255,255,1)); transform:scale(1.35);}
  100%{filter:drop-shadow(0 0 10px rgba(255,0,0,.6)); transform:scale(1);}
}
/* mesmo flash, mas solto no ponto de origem quando não há ícone na tela
   (ex.: transição entre perguntas) */
.flash-energia-origem{
  position:fixed;
  width:70px; height:70px;
  margin-left:-35px; margin-top:-35px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,0,0,.5) 45%, transparent 72%);
  pointer-events:none;
  z-index:44;
  opacity:0;
  animation:acumuloEnergiaSolto .35s ease-out forwards;
}
@keyframes acumuloEnergiaSolto{
  0%{opacity:0; transform:scale(.3);}
  60%{opacity:.9; transform:scale(1.3);}
  100%{opacity:0; transform:scale(1.6);}
}

/* flash de tela cheia — vinheta vermelha rápida, só nos momentos fortes */
.flash-tela-cheia{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:43;
  background:radial-gradient(ellipse at 50% 40%, rgba(255,40,20,.28), rgba(255,0,0,.1) 45%, transparent 78%);
  opacity:0;
  animation:flashTelaCheia .55s ease-out forwards;
}
@keyframes flashTelaCheia{
  0%{opacity:0;}
  22%{opacity:1;}
  100%{opacity:0;}
}

/* rede de conexões entre partículas — linhas + faíscas viajando */
.rede-conexoes-overlay{
  position:fixed; inset:0;
  width:100vw; height:100vh;
  pointer-events:none;
  z-index:44;
}
.linha-rede{
  stroke:#FF6A5C;
  stroke-width:1;
  opacity:0;
  animation:linhaRedeAparece .9s ease forwards;
}
.linha-rede-fria{
  stroke:#DCDDDE;
}
@keyframes linhaRedeAparece{
  0%{opacity:0;}
  30%{opacity:.55;}
  75%{opacity:.3;}
  100%{opacity:0;}
}
.faisca-rede{fill:#FFFFFF; filter:drop-shadow(0 0 4px #fff);}

@media (prefers-reduced-motion: reduce){
  .particula-sinapse, .rede-conexoes-overlay, .flash-energia-origem, .flash-tela-cheia{display:none;}
}

.ativacao-stage{
  position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}

/* campo de pontos ambiente — dá profundidade, bem esparso e discreto */
.ativacao-dots{
  position:absolute;
  width:320px; height:320px;
  top:50%; left:50%; margin-top:-160px; margin-left:-160px;
  pointer-events:none;
}
.ponto-ambiente{
  position:absolute;
  border-radius:50%;
  background:#DCDDDE;
  opacity:0;
  transition:opacity 1.4s ease;
}
.ativacao-dots.visivel .ponto-ambiente{opacity:var(--op-alvo, .35);}
@keyframes derivaAmbiente{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(4px,-3px);}
}

.ativacao-halo{
  position:absolute;
  width:340px; height:340px;
  top:50%; left:50%; margin-top:-170px; margin-left:-170px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,0,0,.22), transparent 68%);
  filter:blur(4px);
  opacity:0;
  transition:opacity 1.3s ease;
  pointer-events:none;
}
.ativacao-stage.fase-conexao .ativacao-halo{opacity:1;}
.ativacao-stage.fase-expansao .ativacao-halo{opacity:1; transform:scale(1.15);}

.ativacao-wrap{
  position:relative;
  width:225px; height:225px;
  transition:transform 1.1s cubic-bezier(.22,.8,.25,1), filter 1.1s ease;
}
.ativacao-wrap.fase-expansao{
  transform:scale(1.32) rotate(3deg);
  filter:drop-shadow(0 0 28px rgba(255,0,0,.4));
}

.icone-ativacao .nucleo{transition:filter .6s ease;}

/* conexões núcleo -> satélite: cada uma nasce junto com seu nó */
.linha-hub{
  stroke:#FF0000; stroke-width:3.2; stroke-linecap:round; opacity:0;
  stroke-dasharray:68; stroke-dashoffset:68;
}
.estagio-no1 .linha-hub.h1{animation:desenharLinha .45s ease forwards, apareceLinha .1s linear forwards;}
.estagio-no2 .linha-hub.h2{animation:desenharLinha .45s ease forwards, apareceLinha .1s linear forwards;}
.estagio-no3 .linha-hub.h3{animation:desenharLinha .45s ease forwards, apareceLinha .1s linear forwards;}
@keyframes apareceLinha{to{opacity:.9;}}
@keyframes desenharLinha{to{stroke-dashoffset:0;}}

/* nós satélite: emergem de dentro pra fora, não estão lá desde o início */
.no-satelite-ativ{
  opacity:0;
  transform:scale(.25);
  transform-box:fill-box;
  transform-origin:center;
  transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
}
.estagio-no1 .no-satelite-ativ.ns1,
.estagio-no2 .no-satelite-ativ.ns2,
.estagio-no3 .no-satelite-ativ.ns3{
  opacity:1;
  transform:scale(1);
}

/* conexões externas entre satélites — só desenham depois que os 3 existem */
.linha-conexao{
  stroke:#FF0000;
  stroke-width:1.6;
  opacity:0;
  stroke-dasharray:118;
  stroke-dashoffset:118;
}
.estagio-triangulo .linha-conexao.l1{opacity:.6; animation:desenharLinha .55s ease forwards; animation-delay:.05s;}
.estagio-triangulo .linha-conexao.l2{opacity:.6; animation:desenharLinha .55s ease forwards; animation-delay:.3s;}
.estagio-triangulo .linha-conexao.l3{opacity:.6; animation:desenharLinha .55s ease forwards; animation-delay:.55s;}

.faisca-viajante{transform-box:fill-box;}

/* respiro final: um único pulso de luz percorre todo o ícone antes da expansão */
.estagio-respiro .nucleo{filter:drop-shadow(0 0 22px rgba(255,255,255,.65));}
.estagio-respiro .linha-hub,
.estagio-respiro .linha-conexao{
  animation:respiroLinha .6s ease;
}
@keyframes respiroLinha{
  0%{opacity:.6;}
  40%{opacity:1; filter:drop-shadow(0 0 5px #fff);}
  100%{opacity:.7;}
}

.ativacao-label{
  margin-top:2rem;
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--cinza-claro);
  opacity:0;
  animation:labelSurge 1s ease forwards;
  animation-delay:.3s;
}
@keyframes labelSurge{
  0%{opacity:0; transform:translateY(4px);}
  100%{opacity:.85; transform:translateY(0);}
}

/* transição geral entre telas — usada em toda troca (montar() aplica
   automaticamente). A tela que sai vira absoluta (não empurra a nova) e
   desaparece em fade-out; a que entra usa a animação "entra" já existente
   logo abaixo. As duas ficam sobrepostas por um instante, criando uma
   sensação de imersão contínua em vez de corte seco. */
.tela.tela-saindo{
  position:absolute;
  inset:0;
  animation:telaSaida .32s ease forwards;
}
@keyframes telaSaida{
  to{opacity:0; transform:scale(.97) translateY(-6px);}
}

/* ---------- portal de entrada do desafio ---------- */
.portal-texto{
  max-width:460px;
  margin-top:.6rem;
}
.portal-linha{
  font-size:15.5px;
  line-height:1.65;
  color:var(--cinza-claro);
  text-align:center;
  opacity:0;
  transform:translateY(6px);
  animation:portalRevela .5s ease forwards;
}
@keyframes portalRevela{
  to{opacity:1; transform:translateY(0);}
}
.portal-cursor{
  display:inline-block;
  margin-left:2px;
  color:var(--vermelho);
  animation:portalPiscar .8s step-end infinite;
}
@keyframes portalPiscar{
  0%,100%{opacity:1;}
  50%{opacity:0;}
}
.portal-eyebrow-linha{
  display:block;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--vermelho);
  font-weight:700;
  margin-bottom:.35rem;
}
.portal-chips{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:1.3rem;
  opacity:0;
  animation:labelSurge .6s ease forwards;
}
.chip-portal{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--branco);
  border:1px solid var(--cinza);
  padding:7px 14px;
  border-radius:999px;
  background:var(--preto-2);
}
.portal-eixos{
  margin-top:.75rem;
  font-size:11px;
  letter-spacing:.06em;
  color:var(--cinza-claro);
  text-transform:uppercase;
  opacity:0;
  animation:labelSurge .6s ease forwards;
}
.portal-eixos-sep{color:var(--vermelho); margin:0 7px;}
.premio-alerta{
  display:flex;
  align-items:center;
  justify-content:center;   /* centraliza o conjunto ícone + texto na caixa */
  gap:10px;
  margin-top:1.7rem;
  padding:12px 22px;
  border-radius:16px;
  border:1px solid rgba(255,0,0,.45);
  /* brilho centralizado, acompanhando o texto (antes ficava deslocado
     para a esquerda, reforçando a impressão de desalinhamento) */
  background:radial-gradient(ellipse at 50% 50%, rgba(255,0,0,.2), rgba(255,0,0,.05));
  color:var(--branco);
  font-family:"SinapseArcade", var(--fonte);
  font-size:10px;
  line-height:1.9;          /* sem isto as linhas se sobrepõem na fonte pixelada */
  letter-spacing:-.02em;
  font-weight:400;
  max-width:420px;
  text-align:center;
  opacity:0;
  animation:premioEntra .7s cubic-bezier(.2,.9,.25,1.1) forwards, premioRespira 2.6s ease-in-out .8s infinite;
}
.premio-icone{width:22px; height:22px; flex-shrink:0;}
@keyframes premioEntra{
  0%{opacity:0; transform:scale(.9) translateY(6px);}
  100%{opacity:1; transform:scale(1) translateY(0);}
}
@keyframes premioRespira{
  0%,100%{box-shadow:0 0 10px rgba(255,0,0,.15);}
  50%{box-shadow:0 0 26px rgba(255,0,0,.4);}
}
.contagem-wrap{
  position:relative;
  width:260px; height:260px;
  display:flex; align-items:center; justify-content:center;
}
.contagem-numero{
  font-size:clamp(120px, 30vw, 220px);
  font-weight:800;
  line-height:1;
  background:linear-gradient(135deg, var(--branco), var(--cinza-claro));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,0,0,.45));
  animation:contagemPulso .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes contagemPulso{
  0%{opacity:0; transform:scale(.4); filter:drop-shadow(0 0 0 rgba(255,0,0,0));}
  35%{opacity:1; transform:scale(1.08); filter:drop-shadow(0 0 40px rgba(255,0,0,.65));}
  100%{opacity:1; transform:scale(1); filter:drop-shadow(0 0 30px rgba(255,0,0,.45));}
}
.contagem-anel{
  position:absolute;
  top:50%; left:50%;
  width:260px; height:260px;
  margin-top:-130px; margin-left:-130px;
  border-radius:50%;
  border:2px solid rgba(255,0,0,.35);
  animation:contagemAnel .9s ease-out both;
}
@keyframes contagemAnel{
  0%{transform:scale(.3); opacity:0;}
  60%{opacity:.7;}
  100%{transform:scale(1); opacity:0;}
}
.contagem-label{
  margin-top:2.2rem;
  color:var(--cinza-claro);
  font-size:14px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.progresso-sinapse{
  display:flex; align-items:center; justify-content:center;
  gap:0;
  margin-bottom:1.4rem;
}
.progresso-no{
  width:11px; height:11px;
  border-radius:50%;
  background:var(--carvao);
  border:1.5px solid var(--cinza);
  transition:background .3s ease, border-color .3s ease, box-shadow .3s ease, transform .3s ease;
}
.progresso-no.concluido{
  background:var(--branco);
  border-color:var(--branco);
}
.progresso-no.atual{
  background:var(--vermelho);
  border-color:var(--vermelho);
  box-shadow:0 0 10px rgba(255,0,0,.7);
  transform:scale(1.3);
}
.progresso-linha{
  width:32px; height:1.5px;
  background:var(--cinza);
  transition:background .4s ease;
}
.progresso-linha.concluido{background:var(--branco);}

.pergunta-topo{width:100%; max-width:680px; display:flex; align-items:center; justify-content:space-between; margin-bottom:1.4rem;}
.tag-eixo{
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:700;
  color:var(--vermelho);
  background:rgba(255,0,0,.1);
  border:1px solid rgba(255,0,0,.3);
  padding:6px 12px;
  border-radius:999px;
  animation:tagEixoRevela .45s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes tagEixoRevela{
  0%{opacity:0; transform:scale(.7) translateX(-6px);}
  100%{opacity:1; transform:scale(1) translateX(0);}
}
.contador-perguntas{color:var(--cinza); font-size:13px; letter-spacing:.05em;}


.pergunta-texto{max-width:680px; text-align:center; font-size:clamp(19px,2.6vw,26px); font-weight:700; line-height:1.35; margin-bottom:2.2rem;}

/* ---------- rede da pergunta (alternativas como nós conectados ao núcleo) ---------- */
.rede-pergunta{
  position:relative;
  width:100%;
  max-width:560px;
  margin:16px auto 0;
  display:flex;
  align-items:center;
  gap:20px;
  padding:10px 0;
  flex-shrink:0;
}
.rede-nucleo{
  flex-shrink:0;
  width:70px; height:70px;
  z-index:2;
}
.rede-nucleo-svg{width:100%; height:100%; display:block;}
.rede-svg-linhas{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:visible;
}
.alt-nos-coluna{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:2;
}
.alt-no{
  width:100%;
  padding:11px 14px 11px 22px;
  border:1.5px solid transparent;
  border-radius:14px;
  background:rgba(23,21,21,.92);
  backdrop-filter:blur(8px);
  color:var(--branco);
  font-size:14px;
  line-height:1.35;
  font-family:"SinapseArcade", var(--fonte);
  text-align:left;
  cursor:pointer;
  transition:border-color .2s ease, background .2s ease, transform .1s ease, opacity .3s ease, box-shadow .3s ease;
  display:flex;
  gap:9px;
  align-items:center;
  backdrop-filter:blur(3px);
}
.alt-no:hover:not(:disabled){
  border-color:var(--cinza-claro);
  background:rgba(35,31,32,.9);
}
.alt-no:active:not(:disabled){transform:scale(.985);}
.alt-no-letra{
  flex-shrink:0;
  width:24px; height:24px;
  border-radius:50%;
  border:1.5px solid var(--cinza);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--cinza-claro);
  background:var(--preto);
}
.alt-no-texto{flex:1;}
.alt-no:disabled{cursor:default;}
.alt-no.selecionada{border-color:var(--branco); background:rgba(65,64,66,.9);}
.alt-no.correta{
  border-color:var(--branco);
  background:rgba(65,64,66,.9);
  box-shadow:0 0 18px rgba(255,255,255,.25);
}
.alt-no.correta .alt-no-letra{background:var(--branco); color:var(--preto); border-color:var(--branco);}
.alt-no.incorreta-marcada{opacity:.4;}

/* linha base neutra ligando cada nó satélite ao núcleo */
.linha-alt{
  stroke:var(--cinza);
  stroke-width:1.3;
  opacity:.55;
  transition:stroke .3s ease, stroke-width .3s ease, opacity .3s ease, filter .3s ease;
}
.linha-alt.linha-ativada{
  stroke:var(--branco);
  stroke-width:2;
  opacity:1;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.7));
}
.linha-alt.linha-circuito-completo{
  stroke:#FF6A5C;
  stroke-width:2.2;
  opacity:1;
  filter:drop-shadow(0 0 10px rgba(255,0,0,.85));
  animation:linhaCircuitoPulso 1.2s ease-out;
}
.linha-alt.linha-correta-revelada{
  stroke:var(--branco);
  stroke-width:2;
  opacity:1;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.6));
}
.linha-alt.linha-esmaecida{opacity:.2;}
@keyframes linhaCircuitoPulso{
  0%{filter:drop-shadow(0 0 4px rgba(255,0,0,.4));}
  40%{filter:drop-shadow(0 0 18px rgba(255,120,80,1));}
  100%{filter:drop-shadow(0 0 10px rgba(255,0,0,.85));}
}

/* nó satélite (círculo no fim de cada linha, entre o núcleo e o botão) */
.no-alt{
  fill:var(--preto-2);
  stroke:var(--cinza);
  stroke-width:1.5;
  transition:fill .3s ease, stroke .3s ease, r .3s ease, filter .3s ease;
}
.no-alt.no-ativado{
  fill:var(--branco);
  stroke:var(--branco);
  filter:drop-shadow(0 0 8px rgba(255,255,255,.8));
}
.no-alt.no-circuito-completo{
  fill:#FF0000;
  stroke:#FF6A5C;
  filter:drop-shadow(0 0 12px rgba(255,0,0,1));
}
.no-alt.no-correta-revelada{
  fill:var(--branco);
  stroke:var(--branco);
  filter:drop-shadow(0 0 10px rgba(255,255,255,.7));
}
.no-alt.no-esmaecido{opacity:.35;}

/* faísca viajando pela linha (animateMotion via JS) */
.pulso-linha-alt{
  fill:#FFFFFF;
  filter:drop-shadow(0 0 5px #FFFFFF) drop-shadow(0 0 10px rgba(255,0,0,.6));
}

/* núcleo do quiz — reage quando o circuito se completa */
.nucleo-quiz{
  transition:filter .4s ease, transform .4s ease;
  transform-origin:center;
  transform-box:fill-box;
}
.nucleo-quiz.nucleo-completo{
  filter:drop-shadow(0 0 22px rgba(255,80,60,1)) drop-shadow(0 0 38px rgba(255,0,0,.65));
  animation:nucleoCompleto .8s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes nucleoCompleto{
  0%{transform:scale(1);}
  40%{transform:scale(1.35);}
  100%{transform:scale(1.1);}
}
.nucleo-quiz-raio{transition:filter .3s ease;}

.micro-feedback{
  width:100%; max-width:680px;
  text-align:center;
  margin-top:14px;
  font-size:14px;
  letter-spacing:.02em;
  min-height:18px;
  color:var(--cinza-claro);
  opacity:0;
  transform:translateY(4px);
  transition:opacity .3s ease, transform .3s ease;
}
.micro-feedback.visivel{opacity:1; transform:translateY(0);}
.micro-feedback.positivo{color:var(--branco); font-weight:600;}

/* ---------- feedback final ---------- */
.revelacao-conteudo{
  display:flex; flex-direction:column; align-items:center;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .55s ease, transform .55s ease;
}
.revelacao-conteudo.revelado{opacity:1; transform:translateY(0);}

.emoji-grande{width:44px; height:44px; margin:0 auto 1rem;}
.feedback-msg{max-width:600px; text-align:center; font-size:18px; line-height:1.55; color:var(--cinza-claro);}
.feedback-msg b{color:var(--branco);}
.selo-sorteio{
  margin-top:1.4rem;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:13.5px;
  font-weight:600;
  color:var(--branco);
  border:1px solid rgba(255,0,0,.55);
  padding:9px 18px;
  border-radius:999px;
  background:radial-gradient(ellipse at 30% 50%, rgba(255,0,0,.22), rgba(255,0,0,.06));
  box-shadow:0 0 18px rgba(255,0,0,.25);
  animation:seloSorteioRespira 2.6s ease-in-out infinite;
}
.selo-sorteio-icone{width:16px; height:16px; flex-shrink:0;}
@keyframes seloSorteioRespira{
  0%,100%{box-shadow:0 0 12px rgba(255,0,0,.2);}
  50%{box-shadow:0 0 24px rgba(255,0,0,.4);}
}

/* ---------- QR Code da experiência individual (mapa de sinapses) ---------- */
.qr-resultado-individual{
  margin-top:1.8rem;
  width:100%;
  max-width:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:20px 18px 22px;
  border-radius:var(--radius);
  border:1px solid var(--carvao);
  background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
  backdrop-filter:blur(6px);
}
.qr-resultado-titulo{
  font-size:14.5px;
  font-weight:700;
  letter-spacing:.02em;
  color:var(--branco);
}
.qr-resultado-svg{
  width:180px;
  height:180px;
  padding:10px;
  background:var(--branco);
  border-radius:14px;
  box-shadow:0 0 22px rgba(255,0,0,.18);
}
.qr-resultado-svg svg{width:100%; height:100%; display:block;}
.qr-resultado-legenda{
  font-size:12px;
  line-height:1.5;
  color:var(--cinza-claro);
  text-align:center;
  max-width:230px;
}

/* ---------- ranking ---------- */
.ranking-wrap{width:100%; max-width:720px;}
.ranking-lista{margin-top:1.6rem; display:flex; flex-direction:column; gap:10px; max-height:52vh; overflow-y:auto;}
.ranking-item{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:var(--preto-2); border:1px solid var(--carvao);
  border-radius:14px; padding:14px 18px;
}
.ranking-pos{width:40px; flex-shrink:0; text-align:center; font-weight:800; font-size:17px; color:var(--vermelho); display:flex; align-items:center; justify-content:center;}

/* nome + loja empilhados, ocupando o espaço central */
.ranking-identificacao{flex:1; min-width:0; margin-right:10px;}
.ranking-nome{font-weight:600; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ranking-loja{
  font-size:9px;
  line-height:1.7;
  color:var(--cinza-claro);
  opacity:.75;
  letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  margin-top:2px;
}

/* pontuação em destaque, tempo e acertos como informação secundária */
.ranking-metricas{flex-shrink:0; text-align:right; white-space:nowrap; display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
.ranking-pontos{font-size:14px; font-weight:800; color:var(--branco); letter-spacing:-.03em;}
.ranking-detalhe{font-size:9px; color:var(--cinza-claro); opacity:.75; letter-spacing:-.01em;}

/* ---------- destaque do pódio ---------- */
.ranking-icone{display:inline-flex; width:26px; height:26px;}
.ranking-icone svg{width:100%; height:100%;}
/* o "ouro/prata/bronze" é construído com a própria paleta: intensidade
   e brilho decrescentes, nunca com cor nova */
.icone-ouro{color:var(--vermelho); filter:drop-shadow(0 0 8px rgba(255,0,0,.85));}
.icone-prata{color:var(--branco); filter:drop-shadow(0 0 5px rgba(255,255,255,.45));}
.icone-bronze{color:var(--cinza-claro); opacity:.8;}

.ranking-destaque{border-color:rgba(255,0,0,.35);}
.ranking-top1{
  border-color:rgba(255,0,0,.65);
  background:linear-gradient(90deg, rgba(255,0,0,.14), var(--preto-2) 55%);
  box-shadow:0 0 24px rgba(255,0,0,.16);
}
.ranking-top1 .ranking-nome{color:var(--branco);}
.ranking-top1 .ranking-pontos{color:var(--vermelho); text-shadow:0 0 12px rgba(255,0,0,.5);}
.ranking-top2{background:linear-gradient(90deg, rgba(255,255,255,.055), var(--preto-2) 55%);}
.ranking-top3{background:linear-gradient(90deg, rgba(220,221,222,.035), var(--preto-2) 55%);}

@media (max-width:520px){
  .ranking-nome{font-size:12px;}
  .ranking-loja{font-size:7.5px;}
  .ranking-pontos{font-size:11.5px;}
  .ranking-detalhe{font-size:7.5px;}
  .ranking-icone{width:20px; height:20px;}
  .ranking-pos{width:30px;}
}
@media (min-width:1400px){
  .ranking-nome{font-size:22px;}
  .ranking-loja{font-size:13px;}
  .ranking-pontos{font-size:20px;}
  .ranking-detalhe{font-size:13px;}
  .ranking-icone{width:38px; height:38px;}
  .ranking-pos{width:56px;}
  .ranking-item{padding:18px 24px;}
}

/* ---------- campos lado a lado no cadastro (loja + estado) ---------- */
.campo-duplo{display:flex; gap:12px;}
.campo-duplo .campo:first-child{flex:1; min-width:0;}
.campo-duplo .campo:last-child{width:110px; flex-shrink:0;}
.campo select{
  width:100%;
  padding:16px 14px;
  border-radius:12px;
  border:1.5px solid var(--cinza);
  background:var(--preto-2);
  color:var(--branco);
  font-family:"SinapseArcade", var(--fonte);
  font-size:14px;
  outline:none;
  appearance:none;
  cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, var(--cinza-claro) 50%), linear-gradient(135deg, var(--cinza-claro) 50%, transparent 50%);
  background-position:calc(100% - 18px) calc(50% + 2px), calc(100% - 13px) calc(50% + 2px);
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
}
.campo select:focus{border-color:var(--vermelho); box-shadow:0 0 0 3px rgba(255,0,0,.15);}
@media (max-width:520px){
  .campo-duplo .campo:last-child{width:88px;}
  .campo select{font-size:12px; padding:14px 12px;}
}
@media (min-width:1400px){
  .campo-duplo .campo:last-child{width:150px;}
  .campo select{font-size:19px; padding:22px 18px;}
}
.ranking-vazio{color:var(--cinza); text-align:center; margin-top:2rem;}

/* ---------- admin ---------- */
.admin-btn{
  position:fixed; bottom:16px; right:16px;
  width:38px; height:38px; border-radius:50%;
  background:var(--preto-2); border:1px solid var(--carvao);
  color:var(--cinza); font-size:16px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:50; opacity:.5;
}
.admin-btn:hover{opacity:1;}

.modal-fundo{
  position:fixed; inset:0; background:rgba(0,0,0,.72);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:4vh 4vw;
}
.modal-card{
  background:var(--preto-2); border:1px solid var(--carvao); border-radius:20px;
  padding:28px; max-width:820px; width:100%; max-height:88vh; overflow-y:auto;
}
.modal-topo{display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem;}
.modal-topo h2{font-size:20px;}
.fechar-x{background:none; border:none; color:var(--cinza-claro); font-size:22px; cursor:pointer;}

.resumo-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:1.4rem;}
.resumo-card{background:var(--preto); border:1px solid var(--carvao); border-radius:12px; padding:14px;}
.resumo-num{font-size:24px; font-weight:800;}
.resumo-label{font-size:11.5px; color:var(--cinza-claro); text-transform:uppercase; letter-spacing:.05em;}

table.tabela-admin{width:100%; border-collapse:collapse; font-size:13px; margin-top:1rem;}
table.tabela-admin th{
  text-align:left; color:var(--cinza-claro); font-weight:600;
  border-bottom:1px solid var(--carvao); padding:8px 6px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
}
table.tabela-admin td{padding:8px 6px; border-bottom:1px solid rgba(65,64,66,.4); vertical-align:top;}
table.tabela-admin input[type=checkbox]{accent-color:var(--vermelho); width:16px; height:16px;}

.aviso-dados{
  background:rgba(255,0,0,.08); border:1px solid rgba(255,0,0,.3); border-radius:12px;
  padding:12px 16px; font-size:12.5px; color:var(--cinza-claro); margin-bottom:1.2rem; line-height:1.5;
}

/* ---------- pop-up de feedback de resposta ---------- */
.modal-feedback-fundo{
  z-index:90;
  animation:feedbackFundoEntra .25s ease both;
}
@keyframes feedbackFundoEntra{
  from{opacity:0;}
  to{opacity:1;}
}
.modal-feedback-card{
  background:radial-gradient(ellipse 280px 220px at 50% 6%, rgba(255,0,0,.24), transparent 72%), var(--preto-2);
  border:1.5px solid var(--carvao);
  border-radius:28px;
  padding:46px 38px 34px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.03), 0 20px 60px rgba(0,0,0,.6);
  animation:feedbackCardEntra .42s cubic-bezier(.2,.95,.25,1.25) both;
}
.modal-feedback-card.positivo{
  border-color:rgba(255,0,0,.55);
  box-shadow:0 0 0 1px rgba(255,0,0,.15), 0 0 50px rgba(255,0,0,.28), 0 20px 60px rgba(0,0,0,.6);
}
.modal-feedback-card.neutro{
  border-color:rgba(255,255,255,.18);
  box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 0 34px rgba(255,255,255,.1), 0 20px 60px rgba(0,0,0,.6);
}
@keyframes feedbackCardEntra{
  0%{opacity:0; transform:scale(.72) translateY(16px);}
  60%{transform:scale(1.04) translateY(-2px);}
  100%{opacity:1; transform:scale(1) translateY(0);}
}
.modal-feedback-icone{
  width:96px; height:96px;
  margin:0 auto .8rem;
}
.modal-feedback-icone svg{width:100%; height:100%; display:block;}
.modal-feedback-card.positivo .modal-feedback-icone .nucleo{
  animation:feedbackPulsoPositivo .7s ease-out;
}
@keyframes feedbackPulsoPositivo{
  0%{filter:drop-shadow(0 0 6px rgba(255,0,0,.5)); transform:scale(1);}
  40%{filter:drop-shadow(0 0 34px rgba(255,255,255,.95)); transform:scale(1.22);}
  100%{filter:drop-shadow(0 0 10px rgba(255,0,0,.6)); transform:scale(1);}
}
.modal-feedback-card.neutro .modal-feedback-icone .nucleo{
  animation:feedbackPulsoNeutro .7s ease-out;
}
@keyframes feedbackPulsoNeutro{
  0%{filter:drop-shadow(0 0 6px rgba(255,0,0,.5)); transform:scale(1);}
  35%{filter:drop-shadow(0 0 4px rgba(122,19,21,.4)); transform:scale(.86);}
  100%{filter:drop-shadow(0 0 8px rgba(255,0,0,.5)); transform:scale(1);}
}
.modal-feedback-emoji{width:42px; height:42px; margin:0 auto .7rem;}
.modal-feedback-titulo{
  font-size:25px; font-weight:800; letter-spacing:.02em;
  color:var(--branco); margin-bottom:.65rem;
}
.modal-feedback-card.neutro .modal-feedback-titulo{color:var(--cinza-claro);}
.modal-feedback-corpo{
  font-size:16px; color:var(--cinza-claro); line-height:1.55; margin-bottom:2rem;
}
.modal-feedback-btn{width:100%; padding:17px 34px; font-size:16.5px;}

@media (max-width:640px){
  .pergunta-texto{font-size:19px;}
  .alt-no{font-size:12.5px; padding:8px 12px 8px 20px; gap:7px;}
  .alt-no-letra{width:22px; height:22px; font-size:10px;}
  .btn{padding:16px 34px; font-size:16px;}
  .modal-feedback-card{padding:36px 26px 26px; max-width:92vw;}
  .modal-feedback-titulo{font-size:21px;}
  .modal-feedback-icone{width:80px; height:80px;}
}

/* a tipografia arcade é larguíssima: usada em texto corrido precisa de
   tamanho menor, entrelinha maior e espaçamento negativo, senão ocupa
   duas vezes o espaço da fonte padrão */
.tagline-game{
  font-family:"SinapseArcade", var(--fonte);
  font-size:13.5px;
  line-height:2.1;
  letter-spacing:-.02em;
  max-width:720px;
  margin:1.1rem auto 0;
  color:var(--cinza-claro);
  text-transform:none;
}
@media (max-width:520px){
  .tagline-game{font-size:11px; line-height:2; letter-spacing:-.03em;}
}
@media (min-width:1400px){
  .tagline-game{font-size:20px; line-height:2.1; max-width:1040px;}
}


/* -------------------------------------------------------------------
   APLICAÇÃO ARCADE NA INTERFACE
   A fonte entra em tudo que é "casca" do jogo: títulos, botões, chips,
   rótulos, contadores, timer, ranking. Fica FORA dos blocos de leitura
   longa (enunciado da pergunta, alternativas, campos do formulário),
   onde a largura da tipografia arcade atrapalharia quem lê com pressa,
   em pé, num estande.
   ------------------------------------------------------------------- */
h1,
.eyebrow,
.btn,
.chip-portal,
.portal-eixos,
.tag-eixo,
.contador-perguntas,
.anel-tempo-numero,
.badge-teste,
.selo-sorteio,
.alt-no-letra,
.ranking-pos,
.ranking-metricas,
.modal-feedback-titulo,
.contagem-numero{
  font-family:"SinapseArcade", var(--fonte);
}

/* a arcade é muito mais larga: cada uso precisa de ajuste próprio de
   tamanho e espaçamento, senão estoura o layout */
h1{
  font-size:clamp(24px, 4vw, 40px);
  letter-spacing:-.04em;
  line-height:1.55;
}
.eyebrow{font-size:11px; letter-spacing:.06em;}
.btn{font-size:15px; letter-spacing:-.02em; line-height:1.6;}
.chip-portal{font-size:11px; letter-spacing:-.01em;}
.portal-eixos{font-size:10px; letter-spacing:-.01em;}
.tag-eixo{font-size:11px; letter-spacing:-.01em;}
.contador-perguntas{font-size:11px; letter-spacing:-.02em;}
.badge-teste{font-size:9.5px; letter-spacing:-.01em;}
.selo-sorteio{font-size:11.5px; letter-spacing:-.02em; line-height:1.8;}
.alt-no-letra{font-size:11px;}
.anel-tempo-numero{font-size:19px; letter-spacing:-.05em;}
.modal-feedback-titulo{font-size:19px; letter-spacing:-.03em; line-height:1.65;}
.ranking-pos{letter-spacing:-.05em;}
.ranking-metricas{font-size:13px; letter-spacing:-.03em;}
.contagem-numero{letter-spacing:-.06em;}

/* sombra dura, sem blur: é o recurso clássico do texto de arcade,
   diferente de um glow suave */
h1, .contagem-numero, .modal-feedback-titulo{
  text-shadow:3px 3px 0 rgba(122,19,21,.85), 0 0 22px rgba(255,0,0,.35);
}
.btn-primario{text-shadow:2px 2px 0 rgba(122,19,21,.7);}

@media (max-width:520px){
  h1{font-size:clamp(19px, 6.2vw, 26px);}
  .btn{font-size:13px;}
  .eyebrow{font-size:9.5px;}
  .premio-alerta{font-size:8.5px; line-height:1.85; max-width:300px;}
  .anel-tempo-numero{font-size:15px;}
  h1, .contagem-numero{text-shadow:2px 2px 0 rgba(122,19,21,.85);}

  /* títulos longos precisam quebrar em vez de vazar da tela: a fonte
     arcade é larga demais para caber numa linha em telas estreitas */
  h1{
    line-height:1.45;
    overflow-wrap:break-word;
    hyphens:none;
    max-width:100%;
  }
  /* a linha de eixos não cabe em 330px: passa a empilhar em duas linhas,
     centralizada, em vez de estourar a largura */
  .portal-eixos{
    font-size:9px;
    flex-wrap:wrap;
    justify-content:center;
    row-gap:2px;
    line-height:1.7;
    max-width:100%;
  }
}
@media (min-width:1400px){
  h1{font-size:clamp(36px, 3.6vw, 62px);}
  .btn{font-size:23px;}
  .eyebrow{font-size:16px;}
  .anel-tempo-numero{font-size:28px;}
  .tag-eixo, .contador-perguntas{font-size:16px;}
  .chip-portal{font-size:16px;}
  .selo-sorteio{font-size:16px;}
  .premio-alerta{font-size:14px; line-height:1.95; max-width:620px;}
  h1, .contagem-numero{text-shadow:4px 4px 0 rgba(122,19,21,.85), 0 0 30px rgba(255,0,0,.35);}
}


/* -------------------------------------------------------------------
   ARCADE EM TODO O TEXTO
   A fonte passa a valer para a interface inteira, inclusive enunciado,
   alternativas e formulário. Como a Press Start 2P é muito mais larga
   e tem altura-de-x baixa, cada bloco de leitura recebe tamanho menor
   e entrelinha bem maior que o padrão — sem isso o texto vira parede.
   Os tamanhos abaixo foram dimensionados pelo PIOR CASO real do banco:
   pergunta de 256 caracteres e alternativa de 91.
   ------------------------------------------------------------------- */
body, input, button, textarea, select{
  font-family:"SinapseArcade", var(--fonte);
}

p.corpo{font-size:12px; line-height:2; letter-spacing:-.02em; max-width:640px;}

.portal-linha{font-size:13px; line-height:2; letter-spacing:-.02em;}

.pergunta-texto{
  font-size:clamp(13px, 1.7vw, 16px);
  line-height:1.85;
  letter-spacing:-.03em;
  font-weight:400;          /* a fonte já é pesada; bold empasta os pixels */
  margin-bottom:1.8rem;
}

.alt-no{
  font-size:11px;
  line-height:1.75;
  letter-spacing:-.02em;
  padding:14px 16px 14px 24px;
}

.campo label{font-size:10px; letter-spacing:-.01em;}
.campo input{font-size:14px; letter-spacing:-.02em;}
.erro-campo{font-size:9.5px; line-height:1.7; letter-spacing:-.02em;}
.dica-campo{font-size:9px; line-height:1.7; letter-spacing:-.02em;}
.aviso-cpf-repetido{font-size:10px; line-height:1.85; letter-spacing:-.02em;}
.lgpd-texto{font-size:10px; line-height:1.95; letter-spacing:-.02em;}
.feedback-msg{font-size:12.5px; line-height:1.95; letter-spacing:-.02em;}
.ranking-nome{font-size:12px; letter-spacing:-.03em;}

@media (max-width:520px){
  p.corpo{font-size:10px; line-height:1.95;}
  .portal-linha{font-size:10.5px; line-height:1.95;}

/* -------------------------------------------------------------------

}


/* ===================================================================
   LEGIBILIDADE DOS TEXTOS DE APOIO E DE TRANSIÇÃO
   Vermelho puro (#FF0000) sobre preto tem contraste ~4,7:1 — suficiente
   para texto grande, insuficiente para rótulos pequenos, ainda mais em
   fonte pixelada. Aqui esses textos passam para #FF6B5E (já na paleta,
   usado no timer crítico), que sobe o contraste para ~7,4:1, e ganham
   corpo maior. Títulos e ícones grandes seguem em vermelho puro.
   =================================================================== */

/* rótulo de seção que aparece no topo de quase toda tela */
.eyebrow{
  font-size:14px;
  color:#FF6B5E;
  letter-spacing:.1em;
  text-shadow:0 0 12px rgba(255,0,0,.35);
}
.portal-eyebrow-linha{
  font-size:13px;
  color:#FF6B5E;
  letter-spacing:.1em;
  text-shadow:0 0 12px rgba(255,0,0,.35);
}
.tag-eixo{
  font-size:13px;
  color:#FF6B5E;
  letter-spacing:.06em;
}
.badge-teste{
  font-size:11px;
  color:#FF6B5E;
  letter-spacing:.05em;
}

/* rótulo da contagem regressiva ("Ativando"): estava fora da tipografia
   do resto e pequeno demais para o momento em que aparece */
.contagem-label{
  font-family:"SinapseArcade", var(--fonte);
  font-size:13px;
  line-height:1.8;
  letter-spacing:.04em;
  color:var(--cinza-claro);
  margin-top:1.8rem;
}

/* "COMEÇAR": era gradiente vermelho sobre preto, ou seja, o texto de
   maior urgência da experiência era o de menor contraste. Passa a ser
   branco com halo vermelho — o vermelho vira o brilho, não a letra. */
.contagem-numero.comecar{
  font-size:clamp(40px, 8vw, 66px);
  color:var(--branco);
  letter-spacing:-.02em;
  text-shadow:
    3px 3px 0 rgba(122,19,21,.9),
    0 0 26px rgba(255,0,0,.85),
    0 0 52px rgba(255,0,0,.45);
  animation:comecarSurge .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes comecarSurge{
  0%{opacity:0; transform:scale(.72);}
  55%{opacity:1; transform:scale(1.08);}
  100%{opacity:1; transform:scale(1);}
}

@media (max-width:520px){
  .eyebrow{font-size:11px;}
  .portal-eyebrow-linha{font-size:10.5px;}
  .tag-eixo{font-size:10.5px;}
  .contagem-label{font-size:10.5px;}
  .contagem-numero.comecar{font-size:clamp(30px, 9vw, 44px);}
}
@media (min-width:1400px){
  .eyebrow{font-size:19px;}
  .portal-eyebrow-linha{font-size:18px;}
  .tag-eixo{font-size:18px;}
  .contagem-label{font-size:18px; margin-top:2.4rem;}
  .contagem-numero.comecar{font-size:clamp(64px, 7vw, 104px);}
}


/* chip da regra de velocidade: é mais longo que os outros dois, então
   ocupa a linha inteira abaixo deles (o flex-wrap já quebra sozinho, o
   flex-basis:100% garante que ele fique centralizado e não desalinhado
   ao lado de um chip curto). Recebe destaque leve por ser a regra que
   muda o comportamento do participante, não só uma informação. */
.chip-velocidade{
  flex-basis:100%;
  max-width:max-content;
  margin:2px auto 0;
  border-color:rgba(255,0,0,.45);
  background:rgba(255,0,0,.08);
  color:#FF6B5E;
}
@media (min-width:1400px){
  /* na TV os três cabem lado a lado */
  .chip-velocidade{flex-basis:auto; margin:0;}
}


/* aviso de backend indisponível — canto inferior esquerdo, discreto para
   o participante mas visível para quem opera o estande */
.aviso-backend{
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:60;
  font-family:"SinapseArcade", var(--fonte);
  font-size:8px;
  letter-spacing:.02em;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid rgba(255,107,94,.5);
  background:rgba(122,19,21,.85);
  color:#FF6B5E;
  pointer-events:none;
}
@media (min-width:1400px){ .aviso-backend{font-size:12px; padding:9px 14px;} }

/* ===================================================================
   MALHA NEURAL (camada de rede ramificada, gerada em runtime)
   Profundidade construída só com opacidade/blur/espessura — o cinza
   claro ocupa o papel que o azul tem na referência visual. Nenhuma
   cor nova entra na paleta.
   =================================================================== */
.malha-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
.malha-camada .malha-linha{fill:none; stroke-linecap:round;}

/* --- plano de fundo: apagado, desfocado, denso --- */
.malha-fundo{opacity:.55;}
.malha-fundo .malha-linha{stroke:rgba(122,19,21,.55);}
.malha-fundo .malha-no{fill:rgba(220,221,222,.3);}
.malha-fundo .malha-no-forte{fill:rgba(255,255,255,.5);}

/* --- plano médio: carrega a leitura principal da malha --- */
.malha-media{opacity:.9;}
.malha-media .malha-linha{stroke:rgba(208,48,37,.3);}
.malha-media .malha-no{fill:rgba(220,221,222,.55);}
.malha-media .malha-no-forte{fill:rgba(255,255,255,.85);}

/* --- primeiro plano: poucos nós, vermelhos, com glow (os acentos) --- */
.malha-frente{opacity:.95;}
.malha-frente .malha-linha{stroke:rgba(255,0,0,.34);}
.malha-frente .malha-no{fill:rgba(208,48,37,.75);}
.malha-frente .malha-no-forte{fill:var(--vermelho);}

.malha-no{animation:malhaNoPulsa 5.5s ease-in-out infinite;}
@keyframes malhaNoPulsa{
  0%,100%{opacity:.55; transform:scale(1);}
  50%{opacity:1; transform:scale(1.35);}
}
.malha-no-forte{animation-duration:3.8s;}

/* --- núcleos luminosos pulsantes espalhados pelo fundo ---
   Cada um recebe --op-nucleo, duração e atraso próprios via style inline,
   então nenhum pulsa em sincronia com o outro. */
.malha-nucleos{pointer-events:none;}
.malha-nucleo-fuga,
.malha-nucleo{
  transform-box:fill-box;
  transform-origin:center;
  animation:malhaNucleoRespira 6s ease-in-out infinite;
}
@keyframes malhaNucleoRespira{
  0%,100%{opacity:calc(var(--op-nucleo, .28) * .55); transform:scale(.9);}
  50%{opacity:var(--op-nucleo, .28); transform:scale(1.14);}
}

/* --- partículas soltas fora da malha (profundidade atmosférica) --- */
/* --- poeira de luz em três profundidades ---
   As distantes são miúdas, apagadas e lentas; as próximas são maiores,
   brilhantes e um pouco mais rápidas. É a diferença entre as camadas que
   cria profundidade — um campo de pontos idênticos leria como padrão. */
.malha-particula{
  fill:rgba(220,221,222,.5);
  animation:malhaParticulaFlutua 6s ease-in-out infinite;
}
.malha-particula-quente{fill:rgba(255,0,0,.6);}

.particula-distante{
  fill:rgba(220,221,222,.4);
  animation-name:particulaDerivaDistante;
}
.particula-distante.malha-particula-quente{fill:rgba(208,48,37,.45);}

.particula-media{
  fill:rgba(220,221,222,.65);
  animation-name:particulaDerivaMedia;
}
.particula-media.malha-particula-quente{fill:rgba(255,0,0,.6);}

.particula-proxima{
  fill:rgba(255,255,255,.85);
  filter:drop-shadow(0 0 3px rgba(255,255,255,.5));
  animation-name:particulaDerivaProxima;
}
.particula-proxima.malha-particula-quente{
  fill:var(--vermelho);
  filter:drop-shadow(0 0 5px rgba(255,0,0,.8));
}

@keyframes malhaParticulaFlutua{
  0%,100%{opacity:.15; transform:translateY(0);}
  50%{opacity:.7; transform:translateY(-7px);}
}
/* quanto mais distante, menor a amplitude e mais discreto o brilho */
@keyframes particulaDerivaDistante{
  0%,100%{opacity:.1; transform:translate(0,0) scale(.9);}
  50%{opacity:.45; transform:translate(1px,-3px) scale(1.05);}
}
@keyframes particulaDerivaMedia{
  0%,100%{opacity:.18; transform:translate(0,0) scale(.95);}
  50%{opacity:.72; transform:translate(-2px,-6px) scale(1.15);}
}
@keyframes particulaDerivaProxima{
  0%,100%{opacity:.25; transform:translate(0,0) scale(.9);}
  50%{opacity:1; transform:translate(3px,-11px) scale(1.3);}
}

/* ===================================================================
   DENSIDADE POR TELA — a malha é protagonista na entrada e recua
   quase totalmente na pergunta, para nunca competir com o texto
   (usa o mesmo mecanismo data-tela que já existia no projeto)
   =================================================================== */
.fio-condutor-layer[data-tela="inicial"] .malha-svg,
.fio-condutor-layer[data-tela="ativacao"] .malha-svg{opacity:1;}

.fio-condutor-layer[data-tela="instrucoes"] .malha-svg{opacity:.9;}
.fio-condutor-layer[data-tela="contagem"] .malha-svg{opacity:1;}

.fio-condutor-layer[data-tela="cadastro"] .malha-svg,
.fio-condutor-layer[data-tela="lgpd"] .malha-svg{opacity:.5;}

/* na pergunta a malha some quase inteira: só o plano de fundo
   permanece, bem discreto. A pergunta é o foco absoluto. */
.fio-condutor-layer[data-tela="pergunta"] .malha-svg{opacity:.28;}
.fio-condutor-layer[data-tela="pergunta"] .malha-frente,
.fio-condutor-layer[data-tela="pergunta"] .malha-media{opacity:.25;}

.fio-condutor-layer[data-tela="feedback"] .malha-svg{opacity:.7;}
.fio-condutor-layer[data-tela="ranking"] .malha-svg{opacity:.55;}

.malha-svg,
.malha-camada,
.malha-frente,
.malha-media{transition:opacity .8s ease;}

/* respeita quem pediu menos movimento no sistema operacional */
body.reduz-movimento .malha-no,
body.reduz-movimento .malha-particula,
body.reduz-movimento .malha-nucleo-fuga{animation:none;}

/* no celular a malha fica mais leve: menos opacidade geral e sem
   animação nas partículas, preservando a profundidade sem custo */
@media (max-width:520px){
  .malha-fundo{opacity:.32;}
  .particula-distante{animation:none; opacity:.22;}
  .particula-media{animation-duration:14s;}
}

/* ===================================================================
   PULSOS E ATIVAÇÃO — a rede como organismo vivo
   Em repouso respira; quando o participante interage, desperta;
   quando ele decide, a informação percorre as conexões.
   =================================================================== */

/* --- pulso viajando por uma conexão --- */
.malha-pulso{
  fill:var(--branco);
  filter:drop-shadow(0 0 6px rgba(255,0,0,.9));
  opacity:.95;
}
.malha-pulso-forte{
  fill:var(--branco);
  filter:drop-shadow(0 0 12px rgba(255,0,0,1)) drop-shadow(0 0 22px rgba(255,106,92,.7));
}

/* --- aresta acesa enquanto o pulso a percorre --- */
.malha-linha{transition:stroke .25s ease, stroke-width .25s ease;}
.malha-camada .malha-linha.aresta-ativa{
  stroke:rgba(255,255,255,.85) !important;
  stroke-width:1.9;
}
.malha-frente .malha-linha.aresta-ativa{
  stroke:var(--vermelho) !important;
  stroke-width:2.4;
}

/* --- nó recebendo a informação --- */
.malha-no{transition:fill .2s ease;}
.malha-no.no-ativado{
  animation:noRecebePulso .48s ease-out;
  fill:var(--branco);
}
.malha-no.no-ativado-forte{
  animation:noRecebePulsoForte .7s ease-out;
  fill:var(--branco);
}
@keyframes noRecebePulso{
  0%{transform:scale(1); filter:none;}
  35%{transform:scale(2.4); filter:drop-shadow(0 0 10px rgba(255,0,0,.9));}
  100%{transform:scale(1); filter:none;}
}
@keyframes noRecebePulsoForte{
  0%{transform:scale(1);}
  30%{transform:scale(3.4); filter:drop-shadow(0 0 18px rgba(255,0,0,1)) drop-shadow(0 0 30px rgba(255,106,92,.8));}
  100%{transform:scale(1); filter:none;}
}
/* o transform dos nós precisa girar em torno do próprio centro */
.malha-no, .malha-particula{transform-box:fill-box; transform-origin:center;}

/* --- ESTADO DE INTERAÇÃO: a rede desperta --- */
.fio-condutor-layer.sinapse-desperta .malha-media{opacity:1;}
.fio-condutor-layer.sinapse-desperta .malha-frente{opacity:1;}
.fio-condutor-layer.sinapse-desperta .malha-nucleo{opacity:calc(var(--op-nucleo, .28) * 1.6);}
.fio-condutor-layer.sinapse-desperta .malha-nucleo-fuga{
  animation:nucleoDesperta 1.6s ease-out;
}
@keyframes nucleoDesperta{
  0%{opacity:.3; transform:scale(.9);}
  25%{opacity:.85; transform:scale(1.25);}
  100%{opacity:.3; transform:scale(.92);}
}

/* --- IGNIÇÃO: "Ativar sinapse" acende o sistema inteiro --- */
.fio-condutor-layer.sinapse-ignicao .malha-svg{opacity:1 !important;}
.fio-condutor-layer.sinapse-ignicao .malha-fundo{opacity:.85;}
.fio-condutor-layer.sinapse-ignicao .malha-media,
.fio-condutor-layer.sinapse-ignicao .malha-frente{opacity:1;}
.fio-condutor-layer.sinapse-ignicao .malha-nucleo-fuga{
  animation:nucleoIgnicao 2.6s ease-out;
}
@keyframes nucleoIgnicao{
  0%{opacity:.25; transform:scale(.8);}
  12%{opacity:1; transform:scale(1.7);}
  40%{opacity:.7; transform:scale(1.3);}
  100%{opacity:.3; transform:scale(.95);}
}
.malha-nucleo-fuga{transform-box:fill-box; transform-origin:center;}

/* ===================================================================
   CÂMERA — deriva lenta com parallax entre os planos.
   Amplitudes diferentes por camada criam profundidade; tudo muito
   lento, para dar imersão sem nunca deixar a interface instável.
   =================================================================== */
.malha-camada, .malha-particulas, .malha-nucleos{
  transform-box:view-box;
  transform-origin:center;
  will-change:transform;
}
.malha-fundo{animation:derivaFundo 96s ease-in-out infinite;}
.malha-media{animation:derivaMedia 74s ease-in-out infinite;}
.malha-frente{animation:derivaFrente 58s ease-in-out infinite;}
.malha-particulas{animation:derivaParticulas 120s ease-in-out infinite;}
.malha-nucleos{animation:derivaFundo 110s ease-in-out infinite;}

/* o plano mais distante quase não se move; o mais próximo se move mais */
@keyframes derivaFundo{
  0%,100%{transform:scale(1.02) translate(0.4%, 0.2%);}
  50%{transform:scale(1.05) translate(-0.4%, -0.4%);}
}
@keyframes derivaMedia{
  0%,100%{transform:scale(1.03) translate(-0.8%, -0.5%);}
  50%{transform:scale(1.08) translate(0.9%, 0.8%);}
}
@keyframes derivaFrente{
  0%,100%{transform:scale(1.05) translate(1.4%, 0.9%);}
  50%{transform:scale(1.13) translate(-1.5%, -1.3%);}
}
@keyframes derivaParticulas{
  0%,100%{transform:translate(1%, 0.6%);}
  50%{transform:translate(-1%, -0.9%);}
}

body.reduz-movimento .malha-nucleo,
body.reduz-movimento .malha-nucleo-fuga,
body.reduz-movimento .malha-fundo,
body.reduz-movimento .malha-media,
body.reduz-movimento .malha-frente,
body.reduz-movimento .malha-particulas{animation:none;}

/* celular: menos deriva (custa GPU) e pulsos menores */
@media (max-width:520px){
  .malha-fundo, .malha-media, .malha-frente, .malha-particulas{animation-duration:150s;}
  .malha-pulso{r:2;}
}

/* ===================================================================
   TIMER EM ANEL DE ENERGIA (substitui a barra linear)
   =================================================================== */
.anel-tempo-wrap{
  position:relative;
  width:64px;
  height:64px;
  flex-shrink:0;
}
.anel-tempo-svg{width:100%; height:100%; transform:rotate(-90deg);}
.anel-tempo-trilha{
  fill:none;
  stroke:var(--carvao);
  stroke-width:4;
}
.anel-tempo-progresso{
  fill:none;
  stroke:var(--vermelho);
  stroke-width:4;
  stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(255,0,0,.55));
  transition:stroke-dashoffset 1s linear, stroke .4s ease;
}
.anel-tempo-numero{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:800;
  color:var(--branco);
  letter-spacing:-.02em;
}

/* últimos segundos: a intensidade sobe, sem ficar agressivo */
.anel-tempo-wrap.critico .anel-tempo-progresso{
  stroke:#FF6B5E;
  filter:drop-shadow(0 0 10px rgba(255,0,0,.9));
}
.anel-tempo-wrap.critico .anel-tempo-numero{
  color:var(--vermelho);
  animation:anelPulsaCritico 1s ease-in-out infinite;
}
@keyframes anelPulsaCritico{
  0%,100%{transform:scale(1); opacity:1;}
  50%{transform:scale(1.16); opacity:.85;}
}
body.reduz-movimento .anel-tempo-wrap.critico .anel-tempo-numero{animation:none;}

@media (max-width:520px){
  .anel-tempo-wrap{width:52px; height:52px;}
  .anel-tempo-numero{font-size:16px;}
}

/* ===================================================================
   MODO TELA GRANDE (TV / totem interativo)
   Ativa a partir de 1400px de largura — nenhum tablet ou celular chega
   perto disso, então não interfere no comportamento em telas pequenas/
   médias. O layout continua o mesmo (fundo e proporção), só a coluna
   central de conteúdo cresce, porque numa TV a pessoa interage mais de
   perto (touch) mas lê o texto a uma distância maior que num tablet de
   mão — então tanto o alvo de toque quanto a fonte precisam ser maiores,
   não só a "escala" da tela.
   =================================================================== */
@media (min-width:1400px){
  :root{
    --area-topo: 150px;
    --area-rodape: 110px;
  }

  .topo-logo{height:74px;}
  .badge-teste{font-size:14px; padding:7px 14px;}

  .icone-wrap{width:300px; height:300px;}

  h1{font-size:clamp(48px, 4.4vw, 84px);}
  p.corpo{font-size:21px; max-width:720px;}

      <!-- ============================================================
           MALHA NEURAL — camada de rede ramificada com convergência
           em perspectiva, gerada proceduralmente em runtime pelo JS
           (ver gerarMalhaNeural no app.js). Três grupos = três planos
           de profundidade. A separação de camadas é feita por
           opacidade/blur/escala, nunca por cor nova: o cinza claro
           ocupa o papel que o azul tem na referência visual, e o
           vermelho fica reservado aos poucos nós de primeiro plano.
           ============================================================ -->
      <svg class="malha-svg" id="malhaSvg" viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="malhaNucleoGrad">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
            <stop offset="35%" stop-color="#FF0000" stop-opacity=".8"/>
            <stop offset="100%" stop-color="#7A1315" stop-opacity="0"/>
          </radialGradient>
          <filter id="malhaBlurFundo" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.4"/>
          </filter>
          <filter id="malhaBlurMedio" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation=".7"/>
          </filter>
          <filter id="malhaGlowFrente" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- núcleos luminosos pulsantes, espalhados pelo fundo em
             profundidades diferentes. Ficam atrás das camadas de linha,
             para o brilho parecer emanar da profundidade da rede. -->
        <g id="malhaNucleos" class="malha-nucleos"></g>
        <g id="malhaFundo" class="malha-camada malha-fundo" filter="url(#malhaBlurFundo)"></g>
        <g id="malhaMedia" class="malha-camada malha-media" filter="url(#malhaBlurMedio)"></g>
        <g id="malhaFrente" class="malha-camada malha-frente" filter="url(#malhaGlowFrente)"></g>
        <g id="malhaParticulas" class="malha-particulas"></g>
        <!-- pulsos de energia viajando pelas conexões, criados em runtime -->
        <g id="malhaPulsos" class="malha-pulsos"></g>
      </svg>

// variante usada na sequência de ativação: a rede nasce do núcleo — os 3 nós
// satélite emergem um a um, cada um "puxando" sua conexão com o núcleo, e só
// depois as 3 conexões externas (o triângulo) se desenham entre eles. Faíscas
// viajam de verdade ao longo das linhas via animateMotion (SVG nativo), não
// só piscam no lugar. É isso que dá a sensação de complexidade crescendo aos
// poucos, em vez de um elemento único que só aumenta de tamanho.
function iconeSVGAtivacao(sufixo) {
  return `
  <svg viewBox="0 0 200 200" class="icone-sinapse icone-ativacao">
    <defs>
      <radialGradient id="hubGrad${sufixo}" cx="50%" cy="45%" r="60%">
        <stop offset="0%" stop-color="#FF6A5C"/>
        <stop offset="45%" stop-color="#FF0000"/>
        <stop offset="100%" stop-color="#7A1315"/>
      </radialGradient>
      <filter id="brilho${sufixo}" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="2.2"/>
      </filter>
    </defs>

    <!-- conexões núcleo -> satélites: nascem junto com cada nó -->
    <g class="linhas-hub">
      <line class="linha-hub h1" x1="100" y1="100" x2="100" y2="34"/>
      <line class="linha-hub h2" x1="100" y1="100" x2="157" y2="133"/>
      <line class="linha-hub h3" x1="100" y1="100" x2="43" y2="133"/>
    </g>

    <!-- conexões externas entre satélites: só se desenham depois que os 3 nós existem -->
    <g class="linhas-triangulo">
      <line class="linha-conexao l1" x1="100" y1="34" x2="157" y2="133"/>
      <line class="linha-conexao l2" x1="157" y1="133" x2="43" y2="133"/>
      <line class="linha-conexao l3" x1="43" y1="133" x2="100" y2="34"/>
    </g>

    <!-- faíscas que viajam de verdade ao longo de cada conexão externa -->
    <circle class="faisca-viajante" r="3.2" fill="#FFFFFF" filter="url(#brilho${sufixo})" opacity="0">
      <animateMotion id="motion1${sufixo}" begin="indefinite" dur="0.5s" fill="freeze" path="M100,34 L157,133"/>
      <animate id="fade1${sufixo}" attributeName="opacity" begin="indefinite" dur="0.5s" values="0;1;0" fill="freeze"/>
    </circle>
    <circle class="faisca-viajante" r="3.2" fill="#FFFFFF" filter="url(#brilho${sufixo})" opacity="0">
      <animateMotion id="motion2${sufixo}" begin="indefinite" dur="0.5s" fill="freeze" path="M157,133 L43,133"/>
      <animate id="fade2${sufixo}" attributeName="opacity" begin="indefinite" dur="0.5s" values="0;1;0" fill="freeze"/>
    </circle>
    <circle class="faisca-viajante" r="3.2" fill="#FFFFFF" filter="url(#brilho${sufixo})" opacity="0">
      <animateMotion id="motion3${sufixo}" begin="indefinite" dur="0.5s" fill="freeze" path="M43,133 L100,34"/>
      <animate id="fade3${sufixo}" attributeName="opacity" begin="indefinite" dur="0.5s" values="0;1;0" fill="freeze"/>
    </circle>

    <circle class="no-satelite-ativ ns1" cx="100" cy="34" r="13" fill="#DCDDDE"/>
    <circle class="no-satelite-ativ ns2" cx="157" cy="133" r="13" fill="#DCDDDE"/>
    <circle class="no-satelite-ativ ns3" cx="43" cy="133" r="13" fill="#DCDDDE"/>
    <circle class="nucleo" cx="100" cy="100" r="26" fill="url(#hubGrad${sufixo})"/>
    <path class="nucleo" d="M100 87 L92 103 L99 103 L96 116 L110 97 L102 97 Z" fill="#FFFFFF"/>
  </svg>`;
}

// utilidades
// ---------------------------------------------------------------
// durante a transição entre telas, a tela antiga fica ~380ms sobreposta à
// nova (crossfade). Nesse intervalo pode existir mais de um elemento com
// o mesmo id/classe no documento — essas duas funções sempre ignoram o
// que estiver dentro de ".tela-saindo", garantindo que qualquer busca
// aponte pra tela ativa, nunca pra que está de saída.
const $ = (sel, root = document) => {
  const el = root.querySelector(sel);
  if (el && el.closest && el.closest(".tela-saindo")) {
    const candidatos = root.querySelectorAll(sel);
    for (const cand of candidatos) {
      if (!cand.closest(".tela-saindo")) return cand;
    }
    return null;
  }
  return el;
};
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel)).filter((el) => !el.closest(".tela-saindo"));

function limparCPF(v) {
  return (v || "").replace(/\D/g, "");
}

function maskCPF(v) {
  v = limparCPF(v).slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  return v;
}

function maskTelefone(v) {
  v = (v || "").replace(/\D/g, "").slice(0, 11);
  if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
  else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
  else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, "($1) $2");
  else if (v.length > 0) v = v.replace(/(\d{0,2})/, "($1");
  return v;
}

function cpfValido(cpfSujo) {
  const cpf = limparCPF(cpfSujo);
  if (cpf.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(cpf)) return false;
  let soma = 0;
  for (let i = 0; i < 9; i++) soma += parseInt(cpf[i], 10) * (10 - i);
  let resto = (soma * 10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== parseInt(cpf[9], 10)) return false;
  soma = 0;
  for (let i = 0; i < 10; i++) soma += parseInt(cpf[i], 10) * (11 - i);
  resto = (soma * 10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== parseInt(cpf[10], 10)) return false;
  return true;
}

function emailValido(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v || "").trim());
}

function telefoneValido(v) {
  return limparCPF(v).length >= 10;
}

function formatarTempo(segundosTotais) {
  const s = Math.round(segundosTotais);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}

function agora() {

// armazenamento local
// Se o navegador bloquear localStorage (acontece em alguns webviews
// abrindo via file://), cai para um array em memória: o quiz continua
// funcionando na sessão, só não sobrevive a um recarregamento de página.
// Se isso acontecer no evento, prefira servir o arquivo por um servidor
// local simples (ex.: "python3 -m http.server") em vez de abrir direto.
// ---------------------------------------------------------------
let ARMAZENAMENTO_EM_MEMORIA = [];
let USANDO_FALLBACK_MEMORIA = false;

function localStorageDisponivel() {
  try {
    const chave = "__teste_sinapse__";
    localStorage.setItem(chave, "1");
    localStorage.removeItem(chave);
    return true;
  } catch (e) {
    return false;
  }
}

function carregarParticipantes() {
  if (USANDO_FALLBACK_MEMORIA) return ARMAZENAMENTO_EM_MEMORIA;
  try {
    return JSON.parse(localStorage.getItem(CONFIG.CHAVE_ARMAZENAMENTO) || "[]");
  } catch (e) {
    USANDO_FALLBACK_MEMORIA = true;
    return ARMAZENAMENTO_EM_MEMORIA;
  }
}

function salvarParticipantes(lista) {
  if (USANDO_FALLBACK_MEMORIA) {
    ARMAZENAMENTO_EM_MEMORIA = lista;
    return;
  }
  try {
    localStorage.setItem(CONFIG.CHAVE_ARMAZENAMENTO, JSON.stringify(lista));
  } catch (e) {
    USANDO_FALLBACK_MEMORIA = true;
    ARMAZENAMENTO_EM_MEMORIA = lista;
  }
}

// ---------------------------------------------------------------
// integração com Supabase — offline-first
//
// O app NUNCA depende de rede para funcionar: cadastro, quiz e ranking
// local continuam 100% em localStorage, como sempre foram. O que muda é
// que, a cada resultado, uma cópia é guardada numa fila de sincronização
// e enviada ao Supabase em segundo plano sempre que houver conexão —
// imediatamente se estiver online, ou na próxima tentativa (a cada
// CONFIG.INTERVALO_SYNC_MS, e sempre que o navegador voltar a ficar
// online). Nenhuma tela trava esperando rede.
// ---------------------------------------------------------------

function supabaseConfigurado() {
  // Verificação robusta em vez de procurar por um texto de exemplo
  // específico: antes esta função buscava literalmente "SUA-CHAVE-ANON",
  // e quando o placeholder mudou para "COLE_AQUI_A_CHAVE_ANON" ela passou
  // a dar "configurado" mesmo sem chave real. O app então tentava gravar
  // com credencial inválida e guardava tudo na fila em silêncio.
  // Agora valida o FORMATO: a chave do Supabase é um JWT, sempre começa
  // com "eyJ" e tem mais de 100 caracteres. Qualquer placeholder falha.
  const url = String(CONFIG.SUPABASE_URL || "");
  const chave = String(CONFIG.SUPABASE_ANON_KEY || "");
  // sem a flag "i" de propósito: a referência de projeto do Supabase é
  // sempre minúscula, então "SEU-PROJETO" (o texto de exemplo) é rejeitado
  const urlValida = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(url.trim());
  const chaveValida = chave.trim().startsWith("eyJ") && chave.trim().length > 100;
  return urlValida && chaveValida;
}
